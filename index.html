<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Orb Breaker</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030611;
  font-family:Arial,sans-serif;
  color:#fff;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 18%,#182b58 0%,#0a1229 35%,#030611 78%);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#hud{
  position:absolute;
  top:max(8px,env(safe-area-inset-top));
  left:7px;
  right:7px;
  z-index:10;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:5px;
}

.stat{
  padding:6px 7px;
  border-radius:11px;
  background:rgba(7,14,31,.82);
  border:1px solid rgba(120,180,255,.2);
  box-shadow:0 4px 18px #0007;
  text-align:center;
  backdrop-filter:blur(8px);
}

.stat small{
  display:block;
  color:#8492b2;
  font-size:8px;
  letter-spacing:1px;
}

.stat strong{
  display:block;
  margin-top:2px;
  font-size:14px;
}

#shopBtn{
  grid-column:1/4;
  border:1px solid #459cff66;
  border-radius:12px;
  padding:9px;
  color:#fff;
  background:linear-gradient(135deg,#17498d,#2679df);
  font-weight:bold;
  box-shadow:0 0 20px #287fff33;
}

#shopBtn:active{transform:scale(.97)}

#shop{
  position:absolute;
  z-index:30;
  left:50%;
  top:50%;
  width:min(92vw,480px);
  max-height:86vh;
  overflow-y:auto;
  transform:translate(-50%,-50%);
  padding:16px;
  border-radius:20px;
  background:rgba(5,11,26,.97);
  border:1px solid #80baff38;
  box-shadow:0 25px 80px #000c;
  display:none;
}

#shop.open{display:block}

.shopHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.shopHead h2{margin:0;font-size:20px}

.close{
  border:0;
  color:#fff;
  background:#18233d;
  border-radius:9px;
  padding:8px 11px;
}

.card{
  margin:9px 0;
  padding:12px;
  border-radius:14px;
  background:linear-gradient(145deg,#17294d,#091226);
  border:1px solid #80baff18;
}

.card h3{margin:0 0 5px;font-size:14px}
.card p{margin:0 0 9px;color:#8795b2;font-size:11px}

.action{
  width:100%;
  padding:10px;
  border:1px solid #5baaff45;
  border-radius:10px;
  color:#fff;
  background:linear-gradient(135deg,#174581,#246dca);
  font-weight:bold;
}

.action:disabled{opacity:.35}

.progress{
  height:7px;
  margin:6px 0 9px;
  background:#060b19;
  border-radius:8px;
  overflow:hidden;
}

.progress i{
  display:block;
  width:0;
  height:100%;
  background:linear-gradient(90deg,#3ca7ff,#c451ff);
  box-shadow:0 0 10px #49aaff;
}

.tier{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
}

.icon{
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

#toast{
  position:absolute;
  z-index:60;
  left:50%;
  bottom:8%;
  transform:translate(-50%,15px);
  padding:9px 14px;
  border-radius:10px;
  background:#070d1eee;
  border:1px solid #6caaff35;
  opacity:0;
  transition:.2s;
  pointer-events:none;
  font-size:12px;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(min-width:700px){
  #game{
    max-width:500px;
    box-shadow:0 0 80px #000;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
  <div class="stat">
    <small>CREDITS</small>
    <strong id="credits">0</strong>
  </div>

  <div class="stat">
    <small>LEVEL</small>
    <strong id="level">1</strong>
  </div>

  <div class="stat">
    <small>SHARDS</small>
    <strong id="shards">0</strong>
  </div>

  <button id="shopBtn">🛒 SHOP</button>
</div>

<div id="shop">

  <div class="shopHead">
    <h2>🛒 Orb Shop</h2>
    <button class="close" id="closeShop">✕</button>
  </div>

  <div class="card">
    <h3>⚪ Buy Basic Ball</h3>
    <p>10 balls automatically merge into the next tier.</p>
    <button class="action" id="buyBall"></button>
  </div>

  <div class="card">
    <h3>⚔ Damage Upgrade</h3>
    <p id="damageInfo"></p>
    <button class="action" id="damageBtn"></button>
  </div>

  <div class="card">
    <h3>⚡ Ball Speed</h3>
    <p id="speedInfo"></p>
    <button class="action" id="speedBtn"></button>
  </div>

  <div class="card">
    <h3>💥 Double Damage</h3>
    <p>Deal 2× damage.</p>
    <button class="action" id="doubleBtn"></button>
  </div>

  <div class="card">
    <h3>🔮 Ball Merge</h3>

    <div class="tier">
      <span class="icon" style="background:#fff;color:#111">⚪</span>
      Basic → Green
    </div>
    <div class="progress"><i id="basicBar"></i></div>

    <div class="tier">
      <span class="icon" style="background:#31df65">🟢</span>
      Green → Pink
    </div>
    <div class="progress"><i id="greenBar"></i></div>

    <div class="tier">
      <span class="icon" style="background:#ff4fc6">🩷</span>
      Pink → Flame
    </div>
    <div class="progress"><i id="pinkBar"></i></div>

    <div class="tier">
      <span class="icon" style="background:#ff581d">🔥</span>
      Flame — MAX
    </div>
  </div>

  <div class="card">
    <h3>✨ Permanent Shards</h3>
    <p id="shardInfo"></p>
  </div>

  <div class="card" id="rebirthCard">
    <h3>♻️ Rebirth</h3>
    <p id="rebirthInfo"></p>
    <button class="action" id="rebirthBtn">REBIRTH</button>
  </div>

</div>

<div id="toast"></div>

</div>

<script>
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0,H=0,dpr=1;

function resize(){
  W=window.innerWidth;
  H=window.innerHeight;
  dpr=Math.min(devicePixelRatio||1,2);

  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  if(blocks.length) buildLevel();
}

window.addEventListener("resize",resize);


/* ================= DATA ================= */

const KEY="orb_breaker_portrait_v1";

let data={
  credits:0,
  level:1,

  runShards:0,
  totalShards:0,

  basic:1,
  green:0,
  pink:0,
  flame:0,

  damageLevel:1,
  speedLevel:1,

  doubleDamage:false
};

try{
  const old=JSON.parse(localStorage.getItem(KEY));
  if(old) data=Object.assign(data,old);
}catch(e){}

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
}


/* ================= CONFIG ================= */

const TYPES={
  basic:{
    color:"#ffffff",
    glow:"#9fd1ff",
    power:1
  },

  green:{
    color:"#42ff76",
    glow:"#17ff5e",
    power:10
  },

  pink:{
    color:"#ff57cf",
    glow:"#ff1db8",
    power:100
  },

  flame:{
    color:"#ff7427",
    glow:"#ff350b",
    power:1000
  }
};

let balls=[];
let blocks=[];
let particles=[];
let floating=[];

let shake=0;
let lastTime=performance.now();


/* ================= HELPERS ================= */

function clamp(n,a,b){
  return Math.max(a,Math.min(b,n));
}

function rnd(a,b){
  return Math.random()*(b-a)+a;
}

function fmt(n){
  if(n<1000)return Math.floor(n);
  if(n<1e6)return (n/1e3).toFixed(1)+"K";
  if(n<1e9)return (n/1e6).toFixed(1)+"M";
  return (n/1e9).toFixed(1)+"B";
}

function toast(t){
  const e=document.getElementById("toast");

  e.textContent=t;
  e.classList.add("show");

  clearTimeout(toast.timer);

  toast.timer=setTimeout(()=>{
    e.classList.remove("show");
  },1200);
}


/* ================= DAMAGE ================= */

function damageMultiplier(){
  let m=1;

  m*=Math.pow(1.25,data.damageLevel-1);

  m*=1+data.totalShards/100;

  if(data.doubleDamage)m*=2;

  return m;
}

function damage(type){
  return Math.max(
    1,
    Math.floor(TYPES[type].power*damageMultiplier())
  );
}


/* ================= BALLS ================= */

function totalBalls(){
  return data.basic+
         data.green+
         data.pink+
         data.flame;
}

function makeBall(type){
  const speed=120+(data.speedLevel-1)*12;

  let angle;

  /*
    Start mostly upward, but never perfectly vertical.
    This gives a natural trajectory.
  */
  angle=-Math.PI/2+rnd(-.48,.48);

  return{
    x:W/2,
    y:H*.73,

    r:type==="flame"?8:6,

    vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,

    type,

    cooldown:new Map(),

    trail:[]
  };
}

function rebuildBalls(){

  balls=[];

  const list=[];

  for(let i=0;i<data.basic;i++)list.push("basic");
  for(let i=0;i<data.green;i++)list.push("green");
  for(let i=0;i<data.pink;i++)list.push("pink");
  for(let i=0;i<data.flame;i++)list.push("flame");

  list.forEach(type=>{
    balls.push(makeBall(type));
  });
}


/* ================= LEVEL ================= */

function buildLevel(){

  blocks=[];

  const cols=7;
  const gap=5;
  const side=10;

  const bw=(W-side*2-gap*(cols-1))/cols;
  const bh=34;

  const rows=clamp(
    4+Math.floor(data.level/15),
    4,
    9
  );

  const startY=105;

  for(let r=0;r<rows;r++){

    for(let c=0;c<cols;c++){

      if(data.level>10 && Math.random()<.06)
        continue;

      const x=side+c*(bw+gap);
      const y=startY+r*(bh+gap);

      const hp=Math.floor(
        (35+data.level*18)*
        (1+r*.17)*
        rnd(.9,1.2)
      );

      blocks.push({
        x,y,
        w:bw,
        h:bh,

        hp,
        maxHp:hp,

        flash:0,
        dead:false,

        hitLock:0,

        hue:200+r*17+c*3
      });
    }
  }
}


/* ================= PARTICLES ================= */

function burst(x,y,type,big=false){

  const t=TYPES[type];
  const count=big?28:10;

  for(let i=0;i<count;i++){

    const a=rnd(0,Math.PI*2);
    const s=rnd(big?90:45,big?280:150);

    particles.push({
      x,y,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s,
      life:1,
      size:rnd(1,big?5:3),
      color:t.glow
    });
  }
}

function textPop(x,y,n){
  floating.push({
    x,y,
    text:"+"+fmt(n),
    life:1
  });
}


/* ================= COLLISION ================= */

function hitBlock(ball,b){

  if(b.dead)return false;

  const cx=clamp(ball.x,b.x,b.x+b.w);
  const cy=clamp(ball.y,b.y,b.y+b.h);

  let dx=ball.x-cx;
  let dy=ball.y-cy;

  const dist2=dx*dx+dy*dy;

  if(dist2>ball.r*ball.r)return false;

  let nx=0,ny=0,penetration=0;

  if(dist2>0.001){

    const d=Math.sqrt(dist2);

    nx=dx/d;
    ny=dy/d;

    penetration=ball.r-d;

  }else{

    const left=Math.abs(ball.x-b.x);
    const right=Math.abs(b.x+b.w-ball.x);
    const top=Math.abs(ball.y-b.y);
    const bottom=Math.abs(b.y+b.h-ball.y);

    const m=Math.min(left,right,top,bottom);

    if(m===left){
      nx=-1;
      ny=0;
      penetration=ball.r+left;
    }else if(m===right){
      nx=1;
      ny=0;
      penetration=ball.r+right;
    }else if(m===top){
      nx=0;
      ny=-1;
      penetration=ball.r+top;
    }else{
      nx=0;
      ny=1;
      penetration=ball.r+bottom;
    }
  }

  /*
    Push the ball outside the block.
  */
  ball.x+=nx*penetration;
  ball.y+=ny*penetration;

  /*
    Reflect only if moving INTO the surface.
    This prevents the annoying repeated
    back-and-forth flipping.
  */
  const vn=ball.vx*nx+ball.vy*ny;

  if(vn<0){

    ball.vx-=2*vn*nx;
    ball.vy-=2*vn*ny;

    const speed=Math.hypot(ball.vx,ball.vy);

    if(speed>0){
      const target=120+(data.speedLevel-1)*12;

      ball.vx=ball.vx/speed*target;
      ball.vy=ball.vy/speed*target;
    }
  }

  /*
    Short cooldown per block.
  */
  ball.cooldown.set(b,70);

  const dmg=damage(ball.type);

  b.hp-=dmg;
  b.flash=1;

  burst(ball.x,ball.y,ball.type,false);

  shake=Math.min(5,shake+.7);

  if(b.hp<=0){

    b.hp=0;
    b.dead=true;

    const reward=Math.max(
      1,
      Math.floor(
        3+
        data.level*.8+
        TYPES[ball.type].power*.25
      )
    );

    data.credits+=reward;

    textPop(b.x+b.w/2,b.y,reward);

    burst(
      b.x+b.w/2,
      b.y+b.h/2,
      ball.type,
      true
    );

    shake=Math.min(10,shake+3);

    checkLevelComplete();
  }

  return true;
}


/* ================= LEVEL COMPLETE ================= */

function checkLevelComplete(){

  if(blocks.some(b=>!b.dead))return;

  /*
    Small delay so the destruction effect
    can be seen.
  */
  if(levelTransition)return;

  levelTransition=1;

  setTimeout(()=>{

    if(data.level<200){

      data.level++;

      if(data.level%10===0){
        data.runShards++;
      }

      buildLevel();
      rebuildBalls();

      toast("LEVEL "+data.level);

      save();

    }else{

      toast("🏆 MAX LEVEL 200");
    }

    levelTransition=0;

  },380);
}

let levelTransition=0;


/* ================= PHYSICS ================= */

function update(dt){

  /*
    Keep dt sane so returning to the tab
    doesn't teleport balls.
  */
  dt=Math.min(dt,.025);

  for(const b of blocks){

    b.flash=Math.max(0,b.flash-dt*5);
    b.hitLock=Math.max(0,b.hitLock-dt*1000);
  }

  for(const ball of balls){

    /*
      Cooldown timers.
    */
    for(const [block,time] of ball.cooldown){

      const next=time-dt*1000;

      if(next<=0)
        ball.cooldown.delete(block);
      else
        ball.cooldown.set(block,next);
    }

    /*
      Trail.
    */
    ball.trail.unshift({
      x:ball.x,
      y:ball.y
    });

    if(ball.trail.length>7)
      ball.trail.pop();

    ball.x+=ball.vx*dt;
    ball.y+=ball.vy*dt;

    /*
      LEFT
    */
    if(ball.x-ball.r<0){

      ball.x=ball.r;

      if(ball.vx<0)
        ball.vx=-ball.vx;
    }

    /*
      RIGHT
    */
    if(ball.x+ball.r>W){

      ball.x=W-ball.r;

      if(ball.vx>0)
        ball.vx=-ball.vx;
    }

    /*
      TOP
      HUD occupies top portion, so gameplay
      starts underneath it.
    */
    const top=90;

    if(ball.y-ball.r<top){

      ball.y=top+ball.r;

      if(ball.vy<0)
        ball.vy=-ball.vy;
    }

    /*
      BOTTOM
      IMPORTANT:
      Ball NEVER falls off screen.
    */
    const bottom=H-ball.r;

    if(ball.y+ball.r>H){

      ball.y=bottom;

      if(ball.vy>0)
        ball.vy=-ball.vy;
    }

    /*
      Block collision.
      Only one block per ball per frame,
      avoiding chaotic multiple reflections.
    */
    for(const block of blocks){

      if(block.dead)continue;

      if(ball.cooldown.has(block))continue;

      if(hitBlock(ball,block))
        break;
    }
  }

  /*
    Particles
  */
  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=170*dt;

    p.life-=dt*2.4;

    if(p.life<=0)
      particles.splice(i,1);
  }

  /*
    Floating credit numbers
  */
  for(let i=floating.length-1;i>=0;i--){

    const f=floating[i];

    f.y-=35*dt;
    f.life-=dt*1.6;

    if(f.life<=0)
      floating.splice(i,1);
  }

  shake*=Math.pow(.001,dt);
}


/* ================= DRAW BACKGROUND ================= */

function drawBackground(){

  const g=ctx.createRadialGradient(
    W/2,H*.3,10,
    W/2,H*.4,Math.max(W,H)
  );

  g.addColorStop(0,"#162b58");
  g.addColorStop(.42,"#09142e");
  g.addColorStop(1,"#02050d");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /*
    subtle grid
  */
  ctx.strokeStyle="rgba(100,160,255,.035)";
  ctx.lineWidth=1;

  for(let x=0;x<W;x+=30){

    ctx.beginPath();
    ctx.moveTo(x,90);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(let y=100;y<H;y+=30){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }
}


/* ================= DRAW BLOCKS ================= */

function drawBlocks(){

  /*
    Requested opacity:
    0.7
  */
  ctx.globalAlpha=.7;

  for(const b of blocks){

    if(b.dead)continue;

    const hpRatio=clamp(b.hp/b.maxHp,0,1);

    const hue=b.hue;

    const grad=ctx.createLinearGradient(
      b.x,b.y,
      b.x,b.y+b.h
    );

    grad.addColorStop(
      0,
      `hsl(${hue},85%,${45+hpRatio*20}%)`
    );

    grad.addColorStop(
      1,
      `hsl(${hue},75%,${20+hpRatio*16}%)`
    );

    ctx.fillStyle=grad;

    ctx.beginPath();
    ctx.roundRect(
      b.x,
      b.y,
      b.w,
      b.h,
      8
    );
    ctx.fill();

    /*
      border
    */
    ctx.strokeStyle=
      `hsla(${hue},100%,75%,.5)`;

    ctx.lineWidth=1;

    ctx.stroke();

    /*
      damage cracks
    */
    if(hpRatio<.75){

      ctx.strokeStyle="rgba(10,15,30,.55)";
      ctx.lineWidth=1.5;

      const cracks=
        Math.floor((1-hpRatio)*5)+1;

      for(let i=0;i<cracks;i++){

        const sx=b.x+b.w*rnd(.2,.8);
        const sy=b.y+b.h*rnd(.2,.8);

        ctx.beginPath();
        ctx.moveTo(sx,sy);

        ctx.lineTo(
          sx+rnd(-10,10),
          sy+rnd(4,13)
        );

        ctx.lineTo(
          sx+rnd(-14,14),
          sy+rnd(10,20)
        );

        ctx.stroke();
      }
    }

    /*
      flash
    */
    if(b.flash>0){

      ctx.fillStyle=
        `rgba(255,255,255,${b.flash*.45})`;

      ctx.fill();
    }
  }

  ctx.globalAlpha=1;
}


/* ================= DRAW BALLS ================= */

function drawBalls(){

  for(const b of balls){

    const t=TYPES[b.type];

    /*
      trail
    */
    for(let i=b.trail.length-1;i>=0;i--){

      const p=b.trail[i];

      const alpha=
        (1-i/b.trail.length)*.18;

      ctx.beginPath();

      ctx.fillStyle=
        t.glow;

      ctx.globalAlpha=alpha;

      ctx.arc(
        p.x,
        p.y,
        b.r*(1-i/b.trail.length),
        0,
        Math.PI*2
      );

      ctx.fill();
    }

    ctx.globalAlpha=1;

    /*
      glow
    */
    ctx.shadowColor=t.glow;
    ctx.shadowBlur=b.type==="flame"?22:13;

    const g=ctx.createRadialGradient(
      b.x-b.r*.35,
      b.y-b.r*.35,
      1,
      b.x,
      b.y,
      b.r*1.5
    );

    g.addColorStop(0,"#fff");
    g.addColorStop(.35,t.color);
    g.addColorStop(1,t.glow);

    ctx.fillStyle=g;

    ctx.beginPath();
    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.shadowBlur=0;

    /*
      Flame particles
    */
    if(b.type==="flame" && Math.random()<.45){

      particles.push({
        x:b.x-rnd(-3,3),
        y:b.y+rnd(2,7),
        vx:rnd(-15,15),
        vy:rnd(20,55),
        life:.35,
        size:rnd(1,3),
        color:"#ff7627"
      });
    }
  }
}


/* ================= PARTICLES DRAW ================= */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=p.life;

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}


/* ================= TEXT DRAW ================= */

function drawFloating(){

  ctx.textAlign="center";
  ctx.font="bold 13px Arial";

  for(const f of floating){

    ctx.globalAlpha=f.life;

    ctx.fillStyle="#ffe96b";

    ctx.shadowColor="#ffbd28";
    ctx.shadowBlur=8;

    ctx.fillText(
      f.text,
      f.x,
      f.y
    );

    ctx.shadowBlur=0;
  }

  ctx.globalAlpha=1;
}


/* ================= DRAW ================= */

function draw(){

  ctx.save();

  if(shake>.05){

    ctx.translate(
      rnd(-shake,shake),
      rnd(-shake,shake)
    );
  }

  drawBackground();
  drawBlocks();
  drawParticles();
  drawBalls();
  drawFloating();

  ctx.restore();
}


/* ================= LOOP ================= */

function loop(now){

  const dt=(now-lastTime)/1000;

  lastTime=now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}


/* ================= SHOP ================= */

function updateUI(){

  document.getElementById("credits").textContent=
    fmt(data.credits);

  document.getElementById("level").textContent=
    data.level;

  document.getElementById("shards").textContent=
    data.totalShards+data.runShards;

  document.getElementById("damageInfo").textContent=
    "Level "+data.damageLevel+
    "/100 • Current damage multiplier "+
    damageMultiplier().toFixed(2)+"×";

  const damageCost=
    Math.floor(
      100*Math.pow(1.08,data.damageLevel-1)
    );

  const damageBtn=
    document.getElementById("damageBtn");

  damageBtn.textContent=
    data.damageLevel>=100
      ? "MAX LEVEL"
      : "Upgrade • "+fmt(damageCost)+" Credits";

  damageBtn.disabled=
    data.damageLevel>=100 ||
    data.credits<damageCost;

  document.getElementById("speedInfo").textContent=
    "Speed Level "+data.speedLevel+
    " • "+(120+(data.speedLevel-1)*12)+" px/s";

  const speedCost=
    Math.floor(
      150*Math.pow(1.15,data.speedLevel-1)
    );

  const speedBtn=
    document.getElementById("speedBtn");

  speedBtn.textContent=
    "Upgrade • "+fmt(speedCost)+" Credits";

  speedBtn.disabled=
    data.credits<speedCost;

  const ballCost=
    Math.floor(
      40*Math.pow(1.16,totalBalls()-1)
    );

  const buy=document.getElementById("buyBall");

  buy.textContent=
    "Buy Basic • "+fmt(ballCost)+" Credits";

  buy.disabled=
    data.credits<ballCost;

  const double=document.getElementById("doubleBtn");

  if(data.doubleDamage){

    double.textContent="✓ ACTIVE";
    double.disabled=true;

  }else{

    double.textContent="Buy • 5,000 Credits";
    double.disabled=data.credits<5000;
  }

  document.getElementById("basicBar").style.width=
    (data.basic%10)*10+"%";

  document.getElementById("greenBar").style.width=
    (data.green%10)*10+"%";

  document.getElementById("pinkBar").style.width=
    (data.pink%10)*10+"%";

  document.getElementById("shardInfo").textContent=
    "Permanent damage bonus: "+
    (data.totalShards)+"% • Run shards: "+
    data.runShards;

  document.getElementById("rebirthInfo").textContent=
    data.level>=100
      ? "Convert your "+data.runShards+
        " run Shards into permanent Shards."
      : "Available from Level 100.";

  document.getElementById("rebirthBtn").disabled=
    data.level<100 || data.runShards<=0;

  document.getElementById("balls").textContent=
    totalBalls();
}


/* ================= BUY BALL ================= */

document.getElementById("buyBall").onclick=()=>{

  const cost=
    Math.floor(
      40*Math.pow(1.16,totalBalls()-1)
    );

  if(data.credits<cost)return;

  data.credits-=cost;

  data.basic++;

  /*
    Automatic merge:
    10 Basic -> Green
  */
  while(data.basic>=10){

    data.basic-=10;
    data.green++;

    toast("🟢 BASIC → GREEN");
  }

  /*
    10 Green -> Pink
  */
  while(data.green>=10){

    data.green-=10;
    data.pink++;

    toast("🩷 GREEN → PINK");
  }

  /*
    10 Pink -> Flame
  */
  while(data.pink>=10){

    data.pink-=10;
    data.flame++;

    toast("🔥 PINK → FLAME");
  }

  rebuildBalls();
  save();
  updateUI();
};


/* ================= DAMAGE UPGRADE ================= */

document.getElementById("damageBtn").onclick=()=>{

  if(data.damageLevel>=100)return;

  const cost=
    Math.floor(
      100*Math.pow(1.08,data.damageLevel-1)
    );

  if(data.credits<cost)return;

  data.credits-=cost;

  data.damageLevel++;

  /*
    Extra free 25% bonus milestones.
    The regular upgrade already adds 25%.
    Milestones give an additional boost.
  */
  if(
    data.damageLevel===25 ||
    data.damageLevel===50 ||
    data.damageLevel===75 ||
    data.damageLevel===100
  ){
    data.damageLevel++;
    toast("✨ MILESTONE BONUS!");
  }

  save();
  updateUI();
};


/* ================= SPEED ================= */

document.getElementById("speedBtn").onclick=()=>{

  const cost=
    Math.floor(
      150*Math.pow(1.15,data.speedLevel-1)
    );

  if(data.credits<cost)return;

  data.credits-=cost;

  data.speedLevel++;

  /*
    Preserve each ball's direction while
    applying the new speed.
  */
  for(const b of balls){

    const s=Math.hypot(b.vx,b.vy);
    const target=120+(data.speedLevel-1)*12;

    if(s>0){
      b.vx=b.vx/s*target;
      b.vy=b.vy/s*target;
    }
  }

  save();
  updateUI();
};


/* ================= DOUBLE DAMAGE ================= */

document.getElementById("doubleBtn").onclick=()=>{

  if(data.doubleDamage)return;

  if(data.credits<5000)return;

  data.credits-=5000;

  data.doubleDamage=true;

  toast("💥 DOUBLE DAMAGE!");

  save();
  updateUI();
};


/* ================= REBIRTH ================= */

document.getElementById("rebirthBtn").onclick=()=>{

  if(data.level<100)return;
  if(data.runShards<=0)return;

  const gained=data.runShards;

  data.totalShards+=gained;

  /*
    Reset normal progression.
    Permanent shards remain.
  */
  data.level=1;
  data.runShards=0;

  data.credits=0;

  data.basic=1;
  data.green=0;
  data.pink=0;
  data.flame=0;

  data.damageLevel=1;
  data.speedLevel=1;
  data.doubleDamage=false;

  buildLevel();
  rebuildBalls();

  toast("♻️ REBIRTH +"+gained+" SHARDS");

  save();
  updateUI();

  closeShop();
};


/* ================= SHOP ================= */

const shop=document.getElementById("shop");

function openShop(){
  updateUI();
  shop.classList.add("open");
}

function closeShop(){
  shop.classList.remove("open");
}

document.getElementById("shopBtn")
  .onclick=openShop;

document.getElementById("closeShop")
  .onclick=closeShop;


/* ================= START ================= */

resize();
buildLevel();
rebuildBalls();
updateUI();

requestAnimationFrame(loop);


/* ================= AUTOSAVE ================= */

setInterval(save,5000);

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(document.hidden)save();
  }
);

</script>
</body>
</html>
