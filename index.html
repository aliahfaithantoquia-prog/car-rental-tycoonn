<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kids Car City</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  overflow:hidden;
  background:#75c96b;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#75c96b;
}

#world{
  position:absolute;
  width:1600px;
  height:1000px;
  background:
    linear-gradient(90deg,transparent 47%,#555 47%,#555 53%,transparent 53%),
    linear-gradient(0deg,transparent 42%,#555 42%,#555 58%,transparent 58%),
    #75c96b;
}

/* Roads */
.road{
  position:absolute;
  background:#555;
}
.road.h{
  left:0;
  width:1600px;
  height:160px;
  top:420px;
}
.road.v{
  top:0;
  height:1000px;
  width:160px;
  left:720px;
}

.line{
  position:absolute;
  background:#f7d85a;
  z-index:2;
}
.line.h{
  width:70px;
  height:6px;
  top:497px;
}
.line.v{
  width:6px;
  height:70px;
  left:797px;
}

/* Buildings */
.building{
  position:absolute;
  width:180px;
  height:130px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  box-shadow:0 8px 15px #0003;
}
.shop{background:#ffcc66}
.house{background:#8bc7ff}
.garage{background:#b894e8}

/* Player */
#player{
  position:absolute;
  width:45px;
  height:45px;
  border-radius:50%;
  background:#ffcf45;
  border:4px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  z-index:10;
  box-shadow:0 4px 10px #0005;
}

/* Cars */
.car{
  position:absolute;
  width:65px;
  height:38px;
  border-radius:10px;
  background:#e94b55;
  border:3px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  z-index:6;
}
.car.blue{background:#4d9cff}
.car.green{background:#50c878}
.car.purple{background:#a56cff}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:30;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.panel{
  background:#142038ee;
  color:white;
  padding:10px 14px;
  border-radius:14px;
  font-weight:bold;
  box-shadow:0 5px 15px #0004;
}

#message{
  position:fixed;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  z-index:40;
  background:#142038ee;
  color:white;
  padding:10px 18px;
  border-radius:12px;
  display:none;
}

/* Controls */
#controls{
  position:fixed;
  bottom:25px;
  left:25px;
  z-index:50;
  width:150px;
  height:150px;
}

.control{
  position:absolute;
  width:55px;
  height:55px;
  border:0;
  border-radius:16px;
  background:#142038dd;
  color:white;
  font-size:25px;
  font-weight:bold;
  box-shadow:0 5px 12px #0005;
}

#up{left:48px;top:0}
#down{left:48px;bottom:0}
#left{left:0;top:48px}
#right{right:0;top:48px}

#interact{
  position:fixed;
  right:25px;
  bottom:35px;
  z-index:50;
  width:75px;
  height:75px;
  border:0;
  border-radius:50%;
  background:#57d68d;
  color:#07130d;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 6px 15px #0005;
}

#start{
  position:fixed;
  inset:0;
  z-index:100;
  background:linear-gradient(135deg,#162746,#0b1020);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}

.startBox{
  max-width:420px;
}

.startBox h1{
  font-size:38px;
  margin:0 0 10px;
}

.startBox p{
  color:#b9c7df;
}

.startBtn{
  border:0;
  background:#57d68d;
  color:#07130d;
  padding:15px 30px;
  border-radius:14px;
  font-size:18px;
  font-weight:bold;
}

@media(min-width:800px){
  #controls{left:40px;bottom:40px}
  #interact{right:40px;bottom:40px}
}
</style>
</head>

<body>

<div id="start">
  <div class="startBox">
    <h1>🚗 Kids Car City</h1>
    <p>
      Explore the city, walk around and discover cars.
      This is a fictional game world with simulated Coins.
    </p>
    <button class="startBtn" onclick="startGame()">PLAY 🎮</button>
  </div>
</div>

<div id="game">

  <div id="world">

    <div class="road h"></div>
    <div class="road v"></div>

    <div class="line h" style="left:120px"></div>
    <div class="line h" style="left:260px"></div>
    <div class="line h" style="left:400px"></div>
    <div class="line h" style="left:540px"></div>
    <div class="line h" style="left:960px"></div>
    <div class="line h" style="left:1100px"></div>
    <div class="line h" style="left:1240px"></div>
    <div class="line h" style="left:1380px"></div>

    <div class="line v" style="top:100px"></div>
    <div class="line v" style="top:230px"></div>
    <div class="line v" style="top:650px"></div>
    <div class="line v" style="top:780px"></div>

    <!-- Buildings -->
    <div class="building shop" style="left:80px;top:80px">🏪</div>
    <div class="building house" style="left:330px;top:90px">🏠</div>
    <div class="building garage" style="left:1040px;top:90px">🏢</div>
    <div class="building shop" style="left:1280px;top:100px">🛒</div>

    <div class="building house" style="left:100px;top:700px">🏡</div>
    <div class="building garage" style="left:350px;top:720px">🔧</div>
    <div class="building shop" style="left:1060px;top:700px">🏪</div>
    <div class="building house" style="left:1300px;top:720px">🏠</div>

    <!-- Cars -->
    <div class="car" style="left:580px;top:475px">🚗</div>
    <div class="car blue" style="left:900px;top:535px">🚙</div>
    <div class="car green" style="left:750px;top:330px">🚘</div>
    <div class="car purple" style="left:815px;top:620px">🏎️</div>

    <!-- Player -->
    <div id="player" style="left:680px;top:480px">🧒</div>

  </div>

  <div id="hud">
    <div class="panel">⭐ Level 1</div>
    <div class="panel">🪙 <span id="coins">1000</span></div>
  </div>

  <div id="message"></div>

  <div id="controls">
    <button class="control" id="up">▲</button>
    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>
    <button class="control" id="down">▼</button>
  </div>

  <button id="interact">ACTION</button>

</div>

<script>
const player=document.getElementById("player");
const world=document.getElementById("world");
const game=document.getElementById("game");
const message=document.getElementById("message");

let x=680;
let y=480;
let speed=5;
let keys={};
let playing=false;

function startGame(){
  document.getElementById("start").style.display="none";
  playing=true;
  showMessage("Welcome to Kids Car City! 🧒🚗");
}

function move(dx,dy){
  if(!playing)return;

  x+=dx;
  y+=dy;

  x=Math.max(0,Math.min(1555,x));
  y=Math.max(0,Math.min(955,y));

  player.style.left=x+"px";
  player.style.top=y+"px";

  camera();
}

function camera(){

  const maxX=1600-window.innerWidth;
  const maxY=1000-window.innerHeight;

  let cx=x-window.innerWidth/2;
  let cy=y-window.innerHeight/2;

  cx=Math.max(0,Math.min(maxX,cx));
  cy=Math.max(0,Math.min(maxY,cy));

  world.style.transform=
    `translate(${-cx}px,${-cy}px)`;
}

function showMessage(text){
  message.textContent=text;
  message.style.display="block";

  clearTimeout(window.msgTimer);

  window.msgTimer=setTimeout(()=>{
    message.style.display="none";
  },2200);
}

/* Keyboard */
document.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
});

document.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

/* Touch buttons */
function holdButton(id,dx,dy){

  const button=document.getElementById(id);

  const start=e=>{
    e.preventDefault();
    keys[id]=true;
  };

  const end=e=>{
    e.preventDefault();
    keys[id]=false;
  };

  button.addEventListener("touchstart",start,{passive:false});
  button.addEventListener("touchend",end,{passive:false});
  button.addEventListener("touchcancel",end,{passive:false});

  button.addEventListener("mousedown",start);
  button.addEventListener("mouseup",end);
  button.addEventListener("mouseleave",end);
}

holdButton("up");
holdButton("down");
holdButton("left");
holdButton("right");

function gameLoop(){

  if(keys["arrowup"]||keys["w"]||keys["up"]) move(0,-speed);
  if(keys["arrowdown"]||keys["s"]||keys["down"]) move(0,speed);
  if(keys["arrowleft"]||keys["a"]||keys["left"]) move(-speed,0);
  if(keys["arrowright"]||keys["d"]||keys["right"]) move(speed,0);

  requestAnimationFrame(gameLoop);
}

document.getElementById("interact").addEventListener("click",()=>{

  const cars=document.querySelectorAll(".car");

  let near=false;

  cars.forEach(car=>{

    const cx=parseInt(car.style.left);
    const cy=parseInt(car.style.top);

    const distance=Math.hypot(
      x-cx,
      y-cy
    );

    if(distance<100){
      near=true;
      showMessage("🚗 You found a car! More features coming soon.");
    }

  });

  if(!near){
    showMessage("👀 Explore the city and find a car!");
  }

});

gameLoop();
camera();
</script>

</body>
</html>
