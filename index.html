<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Orb Breaker</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#02050d;color:white;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 15%,#18356c 0,#0a1630 32%,#030610 78%);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#hud{
  position:absolute;
  top:8px;
  left:7px;
  right:7px;
  z-index:10;
}

.top{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.stat{
  padding:6px 4px;
  text-align:center;
  border-radius:12px;
  background:rgba(5,12,28,.84);
  border:1px solid rgba(120,190,255,.2);
  box-shadow:0 4px 18px #0008;
  backdrop-filter:blur(8px);
}

.stat small{
  display:block;
  font-size:8px;
  letter-spacing:1px;
  color:#8292b2;
}

.stat strong{
  display:block;
  margin-top:2px;
  font-size:14px;
}

#shopBtn{
  width:100%;
  margin-top:6px;
  padding:9px;
  border:1px solid #55a9ff55;
  border-radius:12px;
  background:linear-gradient(135deg,#17488d,#2779df);
  color:#fff;
  font-weight:bold;
  font-size:13px;
  box-shadow:0 0 22px #287fff35;
}

#shopBtn:active{transform:scale(.97)}

#shop{
  position:absolute;
  z-index:50;
  left:50%;
  top:50%;
  width:min(92vw,470px);
  max-height:88vh;
  overflow:auto;
  padding:16px;
  transform:translate(-50%,-50%);
  border-radius:22px;
  background:rgba(4,10,24,.98);
  border:1px solid #83baff35;
  box-shadow:0 25px 90px #000d;
  display:none;
}

#shop.open{
  display:block;
}

.shopHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.shopHead h2{
  margin:0;
  font-size:21px;
}

.close{
  border:0;
  border-radius:9px;
  padding:8px 11px;
  background:#18243d;
  color:white;
}

.card{
  margin:9px 0;
  padding:12px;
  border-radius:15px;
  background:linear-gradient(145deg,#172b50,#081225);
  border:1px solid #80baff18;
}

.card h3{
  margin:0 0 5px;
  font-size:14px;
}

.card p{
  margin:0 0 9px;
  color:#8795b2;
  font-size:11px;
}

.action{
  width:100%;
  padding:10px;
  border:1px solid #5eacff45;
  border-radius:10px;
  color:white;
  background:linear-gradient(135deg,#17467f,#2773ce);
  font-weight:bold;
}

.action:disabled{
  opacity:.35;
}

.progress{
  height:7px;
  margin:6px 0 9px;
  border-radius:10px;
  background:#050a17;
  overflow:hidden;
}

.progress i{
  display:block;
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#3daaff,#c64fff);
  box-shadow:0 0 12px #49aaff;
}

.tier{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
}

.icon{
  width:25px;
  height:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

#toast{
  position:absolute;
  z-index:100;
  left:50%;
  bottom:7%;
  transform:translate(-50%,15px);
  padding:9px 15px;
  border-radius:11px;
  background:#070d1eee;
  border:1px solid #75b4ff35;
  opacity:0;
  transition:.2s;
  pointer-events:none;
  font-size:12px;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(min-width:700px){
  #game{
    width:430px;
    max-width:100vw;
    box-shadow:0 0 90px #000;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
  <div class="top">
    <div class="stat">
      <small>CREDITS</small>
      <strong id="credits">0</strong>
    </div>

    <div class="stat">
      <small>LEVEL</small>
      <strong id="level">1</strong>
    </div>

    <div class="stat">
      <small>SHARDS</small>
      <strong id="shards">0</strong>
    </div>
  </div>

  <button id="shopBtn">🛒 SHOP</button>
</div>

<div id="shop">

  <div class="shopHead">
    <h2>🛒 Orb Shop</h2>
    <button class="close" id="closeShop">✕</button>
  </div>

  <div class="card">
    <h3>⚪ Buy Basic Ball</h3>
    <p>10 balls automatically merge into the next tier.</p>
    <button class="action" id="buyBall"></button>
  </div>

  <div class="card">
    <h3>⚔ Damage</h3>
    <p id="damageInfo"></p>
    <button class="action" id="damageBtn"></button>
  </div>

  <div class="card">
    <h3>⚡ Speed</h3>
    <p id="speedInfo"></p>
    <button class="action" id="speedBtn"></button>
  </div>

  <div class="card">
    <h3>💥 Double Damage</h3>
    <p>Permanent 2× damage for this run.</p>
    <button class="action" id="doubleBtn"></button>
  </div>

  <div class="card">
    <h3>🔮 Ball Merge</h3>

    <div class="tier">
      <span class="icon" style="background:#fff;color:#111">⚪</span>
      Basic → Green
    </div>
    <div class="progress"><i id="basicBar"></i></div>

    <div class="tier">
      <span class="icon" style="background:#35e56a">🟢</span>
      Green → Pink
    </div>
    <div class="progress"><i id="greenBar"></i></div>

    <div class="tier">
      <span class="icon" style="background:#ff4fc6">🩷</span>
      Pink → Flame
    </div>
    <div class="progress"><i id="pinkBar"></i></div>

    <div class="tier">
      <span class="icon" style="background:#ff591e">🔥</span>
      Flame — MAX
    </div>
  </div>

  <div class="card">
    <h3>✨ Shards</h3>
    <p id="shardInfo"></p>
  </div>

  <div class="card">
    <h3>♻️ Rebirth</h3>
    <p id="rebirthInfo"></p>
    <button class="action" id="rebirthBtn">REBIRTH</button>
  </div>

</div>

<div id="toast"></div>

</div>

<script>
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0,H=0,DPR=1;

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);

  buildLevel();
  rebuildBalls();
}

addEventListener("resize",resize);


/* ================= SAVE ================= */

const SAVE="orb_breaker_final_portrait";

let data={
  credits:0,
  level:1,

  runShards:0,
  totalShards:0,

  basic:1,
  green:0,
  pink:0,
  flame:0,

  damageLevel:1,
  speedLevel:1,

  doubleDamage:false
};

try{
  const saved=JSON.parse(localStorage.getItem(SAVE));
  if(saved)data=Object.assign(data,saved);
}catch(e){}

function save(){
  try{
    localStorage.setItem(SAVE,JSON.stringify(data));
  }catch(e){}
}


/* ================= BALL TYPES ================= */

const TYPES={
  basic:{
    color:"#fff",
    glow:"#b8ddff",
    power:1
  },

  green:{
    color:"#3cff72",
    glow:"#16ff5a",
    power:10
  },

  pink:{
    color:"#ff54cc",
    glow:"#ff1bb8",
    power:100
  },

  flame:{
    color:"#ff7627",
    glow:"#ff3009",
    power:1000
  }
};

let balls=[];
let blocks=[];
let particles=[];
let floating=[];

let screenShake=0;
let levelBusy=false;


/* ================= UTILITY ================= */

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function rnd(a,b){
  return Math.random()*(b-a)+a;
}

function format(n){
  if(n<1000)return Math.floor(n);
  if(n<1e6)return (n/1000).toFixed(1)+"K";
  if(n<1e9)return (n/1e6).toFixed(1)+"M";
  return (n/1e9).toFixed(1)+"B";
}

function toast(message){
  const el=document.getElementById("toast");

  el.textContent=message;
  el.classList.add("show");

  clearTimeout(toast.timer);

  toast.timer=setTimeout(()=>{
    el.classList.remove("show");
  },1200);
}


/* ================= DAMAGE ================= */

function multiplier(){

  let m=Math.pow(1.25,data.damageLevel-1);

  m*=1+data.totalShards/100;

  if(data.doubleDamage)m*=2;

  return m;
}

function getDamage(type){
  return Math.max(
    1,
    Math.floor(TYPES[type].power*multiplier())
  );
}


/* ================= BALL DATA ================= */

function ballCount(){
  return data.basic+
         data.green+
         data.pink+
         data.flame;
}

function createBall(type,index){

  const speed=115+(data.speedLevel-1)*10;

  /*
    Different starting angles stop all balls
    from following exactly the same path.
  */
  const angle=
    -Math.PI/2+
    rnd(-.55,.55)+
    (index||0)*.025;

  return{
    x:W/2,
    y:H*.73,

    r:type==="flame"?8:6,

    vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,

    type,

    cooldown:new Map(),

    trail:[]
  };
}

function rebuildBalls(){

  balls=[];

  const types=[];

  for(let i=0;i<data.basic;i++)types.push("basic");
  for(let i=0;i<data.green;i++)types.push("green");
  for(let i=0;i<data.pink;i++)types.push("pink");
  for(let i=0;i<data.flame;i++)types.push("flame");

  types.forEach((type,i)=>{
    balls.push(createBall(type,i));
  });
}


/* ================= LEVEL ================= */

function buildLevel(){

  blocks=[];

  const cols=7;
  const gap=5;
  const side=9;

  const width=
    (W-side*2-gap*(cols-1))/cols;

  const height=34;

  const rows=clamp(
    4+Math.floor(data.level/12),
    4,
    9
  );

  const startY=104;

  for(let row=0;row<rows;row++){

    for(let col=0;col<cols;col++){

      if(data.level>8 && Math.random()<.07)
        continue;

      const x=
        side+col*(width+gap);

      const y=
        startY+row*(height+gap);

      const hp=Math.floor(
        (35+data.level*18)*
        (1+row*.18)*
        rnd(.9,1.15)
      );

      blocks.push({
        x,y,
        w:width,
        h:height,

        hp,
        maxHp:hp,

        flash:0,
        dead:false,

        hue:200+row*18+col*4
      });
    }
  }
}


/* ================= EFFECTS ================= */

function explode(x,y,type,big){

  const t=TYPES[type];

  const amount=big?28:9;

  for(let i=0;i<amount;i++){

    const angle=rnd(0,Math.PI*2);
    const speed=rnd(big?90:40,big?300:150);

    particles.push({
      x,y,

      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,

      life:1,

      size:rnd(1.2,big?5:3),

      color:t.glow
    });
  }
}

function creditText(x,y,value){

  floating.push({
    x,
    y,
    value:"+"+format(value),
    life:1
  });
}


/* ================= COLLISION ================= */

function collide(ball,b){

  if(b.dead)return false;

  const closestX=
    clamp(ball.x,b.x,b.x+b.w);

  const closestY=
    clamp(ball.y,b.y,b.y+b.h);

  let dx=ball.x-closestX;
  let dy=ball.y-closestY;

  const distanceSq=dx*dx+dy*dy;

  if(distanceSq>ball.r*ball.r)
    return false;

  let nx=0;
  let ny=0;
  let penetration=0;

  if(distanceSq>0.001){

    const distance=Math.sqrt(distanceSq);

    nx=dx/distance;
    ny=dy/distance;

    penetration=ball.r-distance;

  }else{

    const left=Math.abs(ball.x-b.x);
    const right=Math.abs(b.x+b.w-ball.x);
    const top=Math.abs(ball.y-b.y);
    const bottom=Math.abs(b.y+b.h-ball.y);

    const nearest=Math.min(
      left,right,top,bottom
    );

    if(nearest===left){
      nx=-1;
      ny=0;
      penetration=ball.r+left;
    }
    else if(nearest===right){
      nx=1;
      ny=0;
      penetration=ball.r+right;
    }
    else if(nearest===top){
      nx=0;
      ny=-1;
      penetration=ball.r+top;
    }
    else{
      nx=0;
      ny=1;
      penetration=ball.r+bottom;
    }
  }

  /*
    Push outside first.
  */
  ball.x+=nx*penetration;
  ball.y+=ny*penetration;

  /*
    Reflect using collision normal.
    Only reverse when actually moving into
    the block.
  */
  const normalVelocity=
    ball.vx*nx+
    ball.vy*ny;

  if(normalVelocity<0){

    ball.vx-=2*normalVelocity*nx;
    ball.vy-=2*normalVelocity*ny;

    const currentSpeed=
      Math.hypot(ball.vx,ball.vy);

    const targetSpeed=
      115+(data.speedLevel-1)*10;

    if(currentSpeed>0){

      ball.vx=
        ball.vx/currentSpeed*targetSpeed;

      ball.vy=
        ball.vy/currentSpeed*targetSpeed;
    }
  }

  /*
    Prevent instant repeated hits.
  */
  ball.cooldown.set(b,65);

  const damage=getDamage(ball.type);

  b.hp-=damage;
  b.flash=1;

  explode(
    ball.x,
    ball.y,
    ball.type,
    false
  );

  screenShake=
    Math.min(5,screenShake+.5);

  if(b.hp<=0){

    b.hp=0;
    b.dead=true;

    const reward=Math.max(
      1,
      Math.floor(
        3+
        data.level*.8+
        TYPES[ball.type].power*.25
      )
    );

    data.credits+=reward;

    creditText(
      b.x+b.w/2,
      b.y,
      reward
    );

    explode(
      b.x+b.w/2,
      b.y+b.h/2,
      ball.type,
      true
    );

    screenShake=
      Math.min(11,screenShake+3);

    checkLevel();
  }

  return true;
}


/* ================= LEVEL CHANGE ================= */

function checkLevel(){

  if(levelBusy)return;

  if(blocks.some(b=>!b.dead))
    return;

  levelBusy=true;

  setTimeout(()=>{

    if(data.level<200){

      data.level++;

      if(data.level%10===0)
        data.runShards++;

      buildLevel();

      /*
        Keep balls moving instead of stopping
        between levels.
      */
      rebuildBalls();

      toast("LEVEL "+data.level);

      save();

    }else{

      toast("🏆 MAX LEVEL 200");
    }

    levelBusy=false;

    updateUI();

  },450);
}


/* ================= UPDATE ================= */

function update(dt){

  dt=Math.min(dt,.025);

  for(const b of blocks){
    b.flash=Math.max(0,b.flash-dt*5);
  }

  for(const ball of balls){

    for(const [block,time] of ball.cooldown){

      const next=time-dt*1000;

      if(next<=0)
        ball.cooldown.delete(block);
      else
        ball.cooldown.set(block,next);
    }

    /*
      Ball trail.
    */
    ball.trail.unshift({
      x:ball.x,
      y:ball.y
    });

    if(ball.trail.length>8)
      ball.trail.pop();

    /*
      Movement.
    */
    ball.x+=ball.vx*dt;
    ball.y+=ball.vy*dt;

    /*
      LEFT.
    */
    if(ball.x-ball.r<0){

      ball.x=ball.r;

      if(ball.vx<0)
        ball.vx=-ball.vx;
    }

    /*
      RIGHT.
    */
    if(ball.x+ball.r>W){

      ball.x=W-ball.r;

      if(ball.vx>0)
        ball.vx=-ball.vx;
    }

    /*
      TOP gameplay boundary.
    */
    const top=91;

    if(ball.y-ball.r<top){

      ball.y=top+ball.r;

      if(ball.vy<0)
        ball.vy=-ball.vy;
    }

    /*
      BOTTOM:
      always bounce.
      Never reset position.
    */
    if(ball.y+ball.r>H){

      ball.y=H-ball.r;

      if(ball.vy>0)
        ball.vy=-ball.vy;
    }

    /*
      One collision per ball per frame.
    */
    for(const block of blocks){

      if(block.dead)continue;
      if(ball.cooldown.has(block))continue;

      if(collide(ball,block))
        break;
    }
  }

  /*
    Particles.
  */
  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=170*dt;

    p.life-=dt*2.5;

    if(p.life<=0)
      particles.splice(i,1);
  }

  /*
    Credit text.
  */
  for(let i=floating.length-1;i>=0;i--){

    const f=floating[i];

    f.y-=35*dt;
    f.life-=dt*1.7;

    if(f.life<=0)
      floating.splice(i,1);
  }

  screenShake*=Math.pow(.001,dt);
}


/* ================= BACKGROUND ================= */

function drawBackground(){

  const gradient=ctx.createRadialGradient(
    W/2,H*.25,10,
    W/2,H*.45,Math.max(W,H)
  );

  gradient.addColorStop(0,"#19386f");
  gradient.addColorStop(.38,"#0b1936");
  gradient.addColorStop(1,"#02050d");

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  /*
    subtle tech grid
  */
  ctx.strokeStyle="rgba(100,170,255,.035)";
  ctx.lineWidth=1;

  for(let x=0;x<W;x+=28){

    ctx.beginPath();
    ctx.moveTo(x,92);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(let y=95;y<H;y+=28){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }
}


/* ================= BLOCK DRAW ================= */

function drawBlocks(){

  /*
    Requested 0.7 opacity.
  */
  ctx.globalAlpha=.7;

  for(const b of blocks){

    if(b.dead)continue;

    const ratio=clamp(
      b.hp/b.maxHp,
      0,
      1
    );

    const grad=ctx.createLinearGradient(
      b.x,b.y,
      b.x,b.y+b.h
    );

    grad.addColorStop(
      0,
      `hsl(${b.hue},85%,${42+ratio*24}%)`
    );

    grad.addColorStop(
      1,
      `hsl(${b.hue},78%,${18+ratio*18}%)`
    );

    ctx.fillStyle=grad;

    ctx.beginPath();
    ctx.roundRect(
      b.x,
      b.y,
      b.w,
      b.h,
      8
    );
    ctx.fill();

    /*
      outer edge
    */
    ctx.strokeStyle=
      `hsla(${b.hue},100%,80%,.55)`;

    ctx.lineWidth=1;

    ctx.stroke();

    /*
      HP bar
    */
    ctx.fillStyle="rgba(0,0,0,.3)";

    ctx.fillRect(
      b.x+5,
      b.y+b.h-6,
      b.w-10,
      3
    );

    ctx.fillStyle=
      "rgba(255,255,255,.72)";

    ctx.fillRect(
      b.x+5,
      b.y+b.h-6,
      (b.w-10)*ratio,
      3
    );

    /*
      Damage cracks.
    */
    if(ratio<.78){

      ctx.strokeStyle=
        "rgba(3,8,20,.65)";

      ctx.lineWidth=1.4;

      const count=
        1+Math.floor((1-ratio)*6);

      for(let i=0;i<count;i++){

        const sx=
          b.x+b.w*rnd(.2,.8);

        const sy=
          b.y+b.h*rnd(.2,.65);

        ctx.beginPath();

        ctx.moveTo(sx,sy);

        ctx.lineTo(
          sx+rnd(-9,9),
          sy+rnd(5,12)
        );

        ctx.lineTo(
          sx+rnd(-14,14),
          sy+rnd(10,20)
        );

        ctx.stroke();
      }
    }

    /*
      Hit flash.
    */
    if(b.flash>0){

      ctx.fillStyle=
        `rgba(255,255,255,${b.flash*.5})`;

      ctx.fill();
    }
  }

  ctx.globalAlpha=1;
}


/* ================= BALL DRAW ================= */

function drawBalls(){

  for(const ball of balls){

    const type=TYPES[ball.type];

    /*
      Trail.
    */
    for(let i=ball.trail.length-1;i>=0;i--){

      const p=ball.trail[i];

      ctx.globalAlpha=
        (1-i/ball.trail.length)*.2;

      ctx.fillStyle=type.glow;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        ball.r*(1-i/ball.trail.length),
        0,
        Math.PI*2
      );

      ctx.fill();
    }

    ctx.globalAlpha=1;

    /*
      Outer glow.
    */
    ctx.shadowColor=type.glow;
    ctx.shadowBlur=
      ball.type==="flame"?24:15;

    const g=ctx.createRadialGradient(
      ball.x-ball.r*.35,
      ball.y-ball.r*.4,
      1,
      ball.x,
      ball.y,
      ball.r*1.5
    );

    g.addColorStop(0,"#fff");
    g.addColorStop(.32,type.color);
    g.addColorStop(1,type.glow);

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
      ball.x,
      ball.y,
      ball.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    /*
      Flame sparkle.
    */
    if(
      ball.type==="flame" &&
      Math.random()<.45
    ){

      particles.push({
        x:ball.x+rnd(-4,4),
        y:ball.y+rnd(2,8),
        vx:rnd(-15,15),
        vy:rnd(20,60),
        life:.35,
        size:rnd(1,3),
        color:"#ff7627"
      });
    }
  }
}


/* ================= PARTICLES DRAW ================= */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=p.life;

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}


/* ================= CREDIT DRAW ================= */

function drawFloating(){

  ctx.textAlign="center";
  ctx.font="bold 13px Arial";

  for(const f of floating){

    ctx.globalAlpha=f.life;

    ctx.fillStyle="#ffe76b";

    ctx.shadowColor="#ffb91e";
    ctx.shadowBlur=8;

    ctx.fillText(
      f.value,
      f.x,
      f.y
    );

    ctx.shadowBlur=0;
  }

  ctx.globalAlpha=1;
}


/* ================= RENDER ================= */

function draw(){

  ctx.save();

  if(screenShake>.05){

    ctx.translate(
      rnd(-screenShake,screenShake),
      rnd(-screenShake,screenShake)
    );
  }

  drawBackground();
  drawBlocks();
  drawParticles();
  drawBalls();
  drawFloating();

  ctx.restore();
}


/* ================= GAME LOOP ================= */

let previous=performance.now();

function loop(now){

  let dt=(now-previous)/1000;

  previous=now;

  dt=Math.min(dt,.025);

  update(dt);
  draw();

  requestAnimationFrame(loop);
}


/* ================= UI ================= */

function updateUI(){

  document.getElementById("credits").textContent=
    format(data.credits);

  document.getElementById("level").textContent=
    data.level;

  document.getElementById("shards").textContent=
    data.totalShards+data.runShards;

  document.getElementById("damageInfo").textContent=
    "Level "+
    data.damageLevel+
    "/100 • "+
    multiplier().toFixed(2)+"× damage";

  const damageCost=
    Math.floor(
      100*Math.pow(
        1.08,
        data.damageLevel-1
      )
    );

  const damageBtn=
    document.getElementById("damageBtn");

  damageBtn.textContent=
    data.damageLevel>=100
      ?"MAX LEVEL"
      :"Upgrade • "+format(damageCost);

  damageBtn.disabled=
    data.damageLevel>=100 ||
    data.credits<damageCost;

  const speed=
    115+(data.speedLevel-1)*10;

  const speedCost=
    Math.floor(
      150*Math.pow(
        1.15,
        data.speedLevel-1
      )
    );

  document.getElementById("speedInfo").textContent=
    "Level "+data.speedLevel+
    " • "+speed+" px/s";

  const speedBtn=
    document.getElementById("speedBtn");

  speedBtn.textContent=
    "Upgrade • "+format(speedCost);

  speedBtn.disabled=
    data.credits<speedCost;

  const ballCost=
    Math.floor(
      40*Math.pow(
        1.16,
        ballCount()-1
      )
    );

  const buy=document.getElementById("buyBall");

  buy.textContent=
    "Buy Basic • "+format(ballCost);

  buy.disabled=
    data.credits<ballCost;

  const double=
    document.getElementById("doubleBtn");

  if(data.doubleDamage){

    double.textContent="✓ ACTIVE";
    double.disabled=true;

  }else{

    double.textContent=
      "Buy • 5,000 Credits";

    double.disabled=
      data.credits<5000;
  }

  document.getElementById("basicBar").style.width=
    (data.basic%10)*10+"%";

  document.getElementById("greenBar").style.width=
    (data.green%10)*10+"%";

  document.getElementById("pinkBar").style.width=
    (data.pink%10)*10+"%";

  document.getElementById("shardInfo").textContent=
    "Permanent bonus: "+
    data.totalShards+
    "% damage • Run shards: "+
    data.runShards;

  document.getElementById("rebirthInfo").textContent=
    data.level>=100
      ?"Convert "+data.runShards+
       " run Shards into permanent Shards."
      :"Available at Level 100.";

  document.getElementById("rebirthBtn").disabled=
    data.level<100 ||
    data.runShards<=0;
}


/* ================= BUY BALL ================= */

document.getElementById("buyBall").onclick=()=>{

  const cost=
    Math.floor(
      40*Math.pow(
        1.16,
        ballCount()-1
      )
    );

  if(data.credits<cost)return;

  data.credits-=cost;
  data.basic++;

  let merged=false;

  while(data.basic>=10){
    data.basic-=10;
    data.green++;
    merged=true;
  }

  while(data.green>=10){
    data.green-=10;
    data.pink++;
    merged=true;
  }

  while(data.pink>=10){
    data.pink-=10;
    data.flame++;
    merged=true;
  }

  if(merged)
    toast("✨ BALL MERGED!");

  rebuildBalls();
  updateUI();
  save();
};


/* ================= DAMAGE ================= */

document.getElementById("damageBtn").onclick=()=>{

  if(data.damageLevel>=100)return;

  const cost=
    Math.floor(
      100*Math.pow(
        1.08,
        data.damageLevel-1
      )
    );

  if(data.credits<cost)return;

  data.credits-=cost;
  data.damageLevel++;

  /*
    Milestones give an extra free level.
  */
  if(
    data.damageLevel===25||
    data.damageLevel===50||
    data.damageLevel===75||
    data.damageLevel===100
  ){

    toast("✨ MILESTONE BONUS!");
  }

  updateUI();
  save();
};


/* ================= SPEED ================= */

document.getElementById("speedBtn").onclick=()=>{

  const cost=
    Math.floor(
      150*Math.pow(
        1.15,
        data.speedLevel-1
      )
    );

  if(data.credits<cost)return;

  data.credits-=cost;
  data.speedLevel++;

  const target=
    115+(data.speedLevel-1)*10;

  for(const ball of balls){

    const speed=
      Math.hypot(ball.vx,ball.vy);

    if(speed){

      ball.vx=
        ball.vx/speed*target;

      ball.vy=
        ball.vy/speed*target;
    }
  }

  updateUI();
  save();
};


/* ================= DOUBLE DAMAGE ================= */

document.getElementById("doubleBtn").onclick=()=>{

  if(data.doubleDamage)return;

  if(data.credits<5000)return;

  data.credits-=5000;
  data.doubleDamage=true;

  toast("💥 DOUBLE DAMAGE!");

  updateUI();
  save();
};


/* ================= REBIRTH ================= */

document.getElementById("rebirthBtn").onclick=()=>{

  if(data.level<100)return;
  if(data.runShards<=0)return;

  data.totalShards+=data.runShards;

  data.runShards=0;

  data.level=1;
  data.credits=0;

  data.basic=1;
  data.green=0;
  data.pink=0;
  data.flame=0;

  data.damageLevel=1;
  data.speedLevel=1;
  data.doubleDamage=false;

  buildLevel();
  rebuildBalls();

  toast("♻️ REBIRTH COMPLETE!");

  closeShop();
  updateUI();
  save();
};


/* ================= SHOP ================= */

const shop=document.getElementById("shop");

function openShop(){
  updateUI();
  shop.classList.add("open");
}

function closeShop(){
  shop.classList.remove("open");
}

document.getElementById("shopBtn")
  .onclick=openShop;

document.getElementById("closeShop")
  .onclick=closeShop;


/* ================= START ================= */

resize();
buildLevel();
rebuildBalls();
updateUI();

requestAnimationFrame(loop);

setInterval(save,5000);

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(document.hidden)save();
  }
);

</script>

</body>
</html>
