<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crystal Bloom</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#090d1c;
  color:white;
  touch-action:none;
}

#game{
  width:100vw;
  height:100vh;
  min-height:500px;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% 30%,#263866 0,#111936 45%,#090d1c 100%);
}

#top{
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 22px;
  flex-shrink:0;
}

.title{
  font-size:25px;
  font-weight:900;
}

.subtitle{
  color:#9eacd0;
  font-size:12px;
  margin-top:3px;
}

.stats{
  display:flex;
  gap:10px;
}

.stat{
  min-width:110px;
  padding:9px 14px;
  border-radius:14px;
  background:#151e38dd;
  border:1px solid #344568;
  text-align:center;
}

.stat small{
  display:block;
  color:#9eacd0;
  font-size:10px;
}

.stat b{
  font-size:18px;
}

#area{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
}

#board{
  position:relative;
  width:min(78vh,650px);
  height:min(78vh,650px);
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(6,1fr);
  gap:8px;
  padding:10px;
  border-radius:24px;
  background:#0c1329dd;
  border:2px solid #33466e;
  box-shadow:0 20px 60px #0008;
}

.cell{
  border-radius:15px;
  background:#151f3b;
  border:1px solid #263758;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}

.gem{
  width:82%;
  height:82%;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(18px,4vw,34px);
  cursor:pointer;
  border:3px solid #ffffff55;
  box-shadow:0 7px 18px #0007,inset 0 3px 8px #fff5;
  transition:.15s;
}

.gem:active{
  transform:scale(.88);
}

.g1{background:radial-gradient(circle at 35% 30%,#b9fff0,#32d6bd 50%,#087f7b)}
.g2{background:radial-gradient(circle at 35% 30%,#d5c5ff,#9170ff 50%,#5030b9)}
.g3{background:radial-gradient(circle at 35% 30%,#ffd7a8,#ff9a43 50%,#c64d12)}
.g4{background:radial-gradient(circle at 35% 30%,#ffb5cf,#ff5d98 50%,#b51d63)}
.g5{background:radial-gradient(circle at 35% 30%,#aee5ff,#40a9ff 50%,#1555bd)}
.g6{background:radial-gradient(circle at 35% 30%,#fff3a5,#ffd83d 50%,#b68b00)}

#side{
  width:210px;
  margin-left:18px;
}

.info{
  background:#121a32dd;
  border:1px solid #344568;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.info h3{
  margin:0 0 8px;
}

.info p{
  margin:6px 0;
  color:#aab7d3;
  font-size:13px;
  line-height:1.5;
}

#message{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.9);
  background:#101a34f5;
  border:1px solid #6076a8;
  padding:18px 25px;
  border-radius:18px;
  font-size:20px;
  font-weight:bold;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:50;
}

#message.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

#portrait{
  display:none;
}

@media (orientation:portrait){
  #portrait{
    display:flex;
    position:fixed;
    inset:0;
    z-index:1000;
    background:#090d1c;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
  }

  #portrait div{
    max-width:320px;
  }

  #portrait h2{
    font-size:28px;
  }

  #portrait p{
    color:#aab7d3;
  }
}

@media(max-width:850px){
  #side{
    display:none;
  }

  #top{
    padding:8px 12px;
  }

  .title{
    font-size:20px;
  }

  .stat{
    min-width:75px;
    padding:7px;
  }

  .stat b{
    font-size:15px;
  }

  #board{
    width:min(82vh,92vw);
    height:min(82vh,92vw);
  }
}
</style>
</head>

<body>

<div id="portrait">
  <div>
    <h2>📱↔️ Rotate Your Device</h2>
    <p>Please use landscape mode to play Crystal Bloom.</p>
  </div>
</div>

<div id="game">

  <div id="top">
    <div>
      <div class="title">💎 Crystal Bloom</div>
      <div class="subtitle">Merge • Grow • Discover</div>
    </div>

    <div class="stats">
      <div class="stat">
        <small>SCORE</small>
        <b id="score">0</b>
      </div>

      <div class="stat">
        <small>COINS</small>
        <b id="coins">100</b>
      </div>
    </div>
  </div>

  <div id="area">

    <div id="board"></div>

    <div id="side">
      <div class="info">
        <h3>💠 How to Play</h3>
        <p>Tap two matching crystals to merge them.</p>
        <p>Higher crystals give more score.</p>
      </div>

      <div class="info">
        <h3>⭐ Current Level</h3>
        <p id="level">Level 1</p>
      </div>
    </div>

  </div>

</div>

<div id="message"></div>

<script>

const SIZE=6;

const TYPES=[
  {emoji:"💎",class:"g1"},
  {emoji:"🔮",class:"g2"},
  {emoji:"🟠",class:"g3"},
  {emoji:"💗",class:"g4"},
  {emoji:"🔵",class:"g5"},
  {emoji:"🌟",class:"g6"}
];

let board=[];
let score=0;
let coins=100;
let selected=null;

function createBoard(){

  board=[];

  for(let i=0;i<SIZE*SIZE;i++){

    board.push({
      type:Math.floor(Math.random()*3),
      level:1
    });

  }

  render();
}

function render(){

  const el=document.getElementById("board");

  el.innerHTML="";

  board.forEach((gem,index)=>{

    const cell=document.createElement("div");
    cell.className="cell";

    if(gem){

      const crystal=document.createElement("div");

      crystal.className="gem "+TYPES[gem.type].class;

      crystal.textContent=TYPES[gem.type].emoji;

      if(selected===index){
        crystal.style.outline="4px solid white";
        crystal.style.transform="scale(1.08)";
      }

      crystal.onclick=()=>selectGem(index);

      cell.appendChild(crystal);

    }

    el.appendChild(cell);

  });

  document.getElementById("score").textContent=score.toLocaleString();
  document.getElementById("coins").textContent=coins.toLocaleString();

  document.getElementById("level").textContent=
    "Level "+(Math.floor(score/1000)+1);
}

function selectGem(index){

  if(!board[index])return;

  if(selected===null){

    selected=index;
    render();
    return;

  }

  if(selected===index){

    selected=null;
    render();
    return;

  }

  const a=board[selected];
  const b=board[index];

  if(a.type===b.type && a.level===b.level){

    merge(selected,index);

  }else{

    selected=index;
    render();

  }

}

function merge(a,b){

  const old=board[a];

  board[a]={
    type:old.type,
    level:old.level+1
  };

  board[b]=null;

  score+=old.level*100;
  coins+=old.level*5;

  selected=null;

  showMessage("✨ MERGED!");

  fillEmpty();

  render();

}

function fillEmpty(){

  const empty=[];

  board.forEach((g,i)=>{
    if(!g)empty.push(i);
  });

  empty.forEach(i=>{

    board[i]={
      type:Math.floor(Math.random()*3),
      level:1
    };

  });

}

function showMessage(text){

  const el=document.getElementById("message");

  el.textContent=text;

  el.classList.add("show");

  clearTimeout(window.messageTimer);

  window.messageTimer=setTimeout(()=>{
    el.classList.remove("show");
  },700);

}

createBoard();

</script>

</body>
</html>
