<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Orb Breaker</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070d;
  font-family:Arial,sans-serif;
  color:white;
  touch-action:none;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  max-width:430px;
  margin:auto;
  overflow:hidden;
  background:#05070d;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#hud{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:10;
  padding:9px;
  pointer-events:none;
}

.topbar{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
}

.stat{
  background:rgba(10,15,28,.9);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:7px 9px;
  font-size:11px;
}

button{
  border:0;
  border-radius:10px;
  padding:8px 10px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}

#shopBtn{
  margin-left:auto;
  pointer-events:auto;
  background:white;
  color:#111;
}

#speedBoostBtn{
  pointer-events:auto;
  background:#ffc400;
  color:#111;
}

#shop{
  position:absolute;
  z-index:30;
  left:9px;
  right:9px;
  top:64px;
  max-height:calc(100% - 74px);
  overflow-y:auto;
  display:none;
  padding:14px;
  border-radius:16px;
  background:rgba(7,10,20,.98);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 15px 50px rgba(0,0,0,.7);
}

#shop.show{
  display:block;
}

.shopHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.shopHead h2{
  margin:0;
}

.closeBtn{
  background:#252b3d;
  color:white;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.item{
  padding:10px;
  border-radius:12px;
  background:#11172a;
  border:1px solid rgba(255,255,255,.08);
}

.item.full{
  grid-column:1/-1;
}

.item h3{
  margin:0 0 5px;
  font-size:14px;
}

.item p{
  min-height:27px;
  margin:0 0 8px;
  color:#aeb6cb;
  font-size:11px;
}

.item button{
  width:100%;
  background:white;
  color:#111;
}

.item button:disabled{
  opacity:.35;
}

.ballInfo{
  margin-top:10px;
  text-align:center;
  color:#aeb6cb;
  font-size:11px;
}

#toast{
  position:absolute;
  z-index:100;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  padding:9px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.9);
  transition:.2s;
  pointer-events:none;
  font-size:12px;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:360px){
  .grid{
    grid-template-columns:1fr;
  }

  .item.full{
    grid-column:auto;
  }

  .stat{
    padding:6px;
    font-size:10px;
  }

  #speedBoostBtn{
    font-size:10px;
    padding:7px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
  <div class="topbar">

    <div class="stat">
      💰 <span id="credits">0</span>
    </div>

    <div class="stat">
      ⭐ Lv <span id="level">1</span>
    </div>

    <div class="stat">
      💎 <span id="shards">0</span>
    </div>

    <button id="speedBoostBtn">
      ⚡ +50% SPEED
    </button>

    <button id="shopBtn">
      SHOP
    </button>

  </div>
</div>

<div id="shop">

  <div class="shopHead">
    <h2>🛒 Store</h2>
    <button class="closeBtn" id="closeShop">×</button>
  </div>

  <div class="grid">

    <div class="item">
      <h3>⚪ Buy Ball</h3>
      <p id="ballPriceInfo">
        Add a basic ball.
      </p>
      <button id="buyBall">
        Buy
      </button>
    </div>

    <div class="item">
      <h3>⚔️ Damage</h3>
      <p id="damageInfo"></p>
      <button id="upgradeDamage">
        Upgrade
      </button>
    </div>

    <div class="item">
      <h3>💨 Speed</h3>
      <p id="speedInfo"></p>
      <button id="upgradeSpeed">
        Upgrade
      </button>
    </div>

    <div class="item">
      <h3>💰 Low Ball Price</h3>
      <p id="lowPriceInfo">
        Lower the price of new balls.
      </p>
      <button id="lowPriceBtn">
        Upgrade
      </button>
    </div>

    <div class="item">
      <h3>🔥 Double Damage</h3>
      <p>Double all ball damage.</p>
      <button id="doubleDamageBtn">
        Buy
      </button>
    </div>

    <div class="item">
      <h3>💎 Rebirth</h3>
      <p id="rebirthInfo">
        Reach Level 100.
      </p>
      <button id="rebirthBtn">
        Level 100 Required
      </button>
    </div>

  </div>

  <div class="ballInfo">
    ⚪ <span id="basicCount">1</span>
    &nbsp; 🟢 <span id="greenCount">0</span>
    &nbsp; 🩷 <span id="pinkCount">0</span>
    &nbsp; 🔥 <span id="flameCount">0</span>
  </div>

</div>

<div id="toast"></div>

<script>
"use strict";

/* =========================================================
   SETUP
========================================================= */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const game =
  document.getElementById("game");

const shop =
  document.getElementById("shop");

const toastEl =
  document.getElementById("toast");

const SAVE_KEY =
  "orbBreakerSave_v2";

const MAX_LEVEL = 200;
const MAX_ACTIVE_BALLS = 80;

/* =========================================================
   DATA
========================================================= */

const defaultData = {
  credits:500,
  level:1,
  totalShards:0,
  runShards:0,

  damageLevel:1,
  speedLevel:1,

  doubleDamage:false,

  ballBuyCount:0,
  lowPriceLevel:0,

  balls:{
    basic:1,
    green:0,
    pink:0,
    flame:0
  }
};

let data =
  loadSave();

let W=0;
let H=0;
let dpr=1;

let balls=[];
let blocks=[];
let particles=[];

let lastTime =
  performance.now();

let levelChanging=false;

let speedBoost =
  1;

let mergeState=null;

let toastTimer=null;

/* =========================================================
   LOAD
========================================================= */

function loadSave(){

  try{

    const saved =
      localStorage.getItem(
        SAVE_KEY
      );

    if(!saved){
      return structuredClone(
        defaultData
      );
    }

    const raw =
      JSON.parse(saved);

    const d =
      structuredClone(
        defaultData
      );

    d.credits =
      Math.max(
        0,
        Math.floor(
          Number(raw.credits)||500
        )
      );

    d.level =
      Math.max(
        1,
        Math.min(
          MAX_LEVEL,
          Math.floor(
            Number(raw.level)||1
          )
        )
      );

    d.totalShards =
      Math.max(
        0,
        Math.floor(
          Number(raw.totalShards)||0
        )
      );

    d.runShards =
      Math.max(
        0,
        Math.floor(
          Number(raw.runShards)||0
        )
      );

    d.damageLevel =
      Math.max(
        1,
        Math.floor(
          Number(raw.damageLevel)||1
        )
      );

    d.speedLevel =
      Math.max(
        1,
        Math.min(
          8,
          Math.floor(
            Number(raw.speedLevel)||1
          )
        )
      );

    d.doubleDamage =
      !!raw.doubleDamage;

    d.ballBuyCount =
      Math.max(
        0,
        Math.floor(
          Number(raw.ballBuyCount)||0
        )
      );

    d.lowPriceLevel =
      Math.max(
        0,
        Math.floor(
          Number(raw.lowPriceLevel)||0
        )
      );

    if(raw.balls){

      for(
        const type of
        ["basic","green","pink","flame"]
      ){

        d.balls[type] =
          Math.max(
            0,
            Math.floor(
              Number(
                raw.balls[type]
              )||0
            )
          );
      }
    }

    if(
      d.balls.basic +
      d.balls.green +
      d.balls.pink +
      d.balls.flame <= 0
    ){
      d.balls.basic=1;
    }

    return d;

  }catch{

    return structuredClone(
      defaultData
    );
  }
}

function save(){

  try{

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(data)
    );

  }catch{}
}

/* =========================================================
   RESIZE
========================================================= */

function resize(){

  const rect =
    game.getBoundingClientRect();

  W=rect.width;
  H=rect.height;

  dpr =
    Math.min(
      window.devicePixelRatio||1,
      2
    );

  canvas.width =
    W*dpr;

  canvas.height =
    H*dpr;

  canvas.style.width =
    W+"px";

  canvas.style.height =
    H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );
}

window.addEventListener(
  "resize",
  resize
);

/* =========================================================
   BALL TYPES
========================================================= */

const BALL_TYPES={

  basic:{
    damage:1,
    radius:7,
    color:"#ffffff"
  },

  green:{
    damage:10,
    radius:8,
    color:"#43ff86"
  },

  pink:{
    damage:100,
    radius:9,
    color:"#ff62d6"
  },

  flame:{
    damage:1000,
    radius:10,
    color:"#ff7b25"
  }
};

/* =========================================================
   BALL DAMAGE
========================================================= */

function ballDamage(type){

  let value =
    BALL_TYPES[type].damage;

  value *=
    Math.pow(
      1.25,
      data.damageLevel-1
    );

  value *=
    1 + data.totalShards/100;

  if(data.doubleDamage){
    value*=2;
  }

  return Math.max(
    1,
    Math.floor(value)
  );
}

/* =========================================================
   SPEED
========================================================= */

function baseSpeed(){

  return (
    145 +
    data.speedLevel*10
  ) *
  (
    1 +
    (data.speedLevel-1)*.12
  );
}

/* =========================================================
   CREATE BALL
========================================================= */

function createBall(
  type,
  x=W/2,
  y=H/2
){

  let angle;

  do{

    angle =
      Math.random() *
      Math.PI*2;

  }while(
    Math.abs(
      Math.sin(angle)
    ) < .28
  );

  const speed =
    baseSpeed() *
    speedBoost;

  return{

    x,
    y,

    vx:
      Math.cos(angle)*speed,

    vy:
      Math.sin(angle)*speed,

    radius:
      BALL_TYPES[type].radius,

    type,

    color:
      BALL_TYPES[type].color,

    trail:[],

    hitCooldown:new Map(),

    mergeLocked:false,

    alive:true
  };
}

/* =========================================================
   TOTAL BALLS
========================================================= */

function totalBallCount(){

  return (
    data.balls.basic+
    data.balls.green+
    data.balls.pink+
    data.balls.flame
  );
}

/* =========================================================
   REBUILD
========================================================= */

function rebuildBalls(){

  balls=[];

  const types=[
    "basic",
    "green",
    "pink",
    "flame"
  ];

  for(
    const type of types
  ){

    let count =
      data.balls[type];

    while(
      count>0 &&
      balls.length<
      MAX_ACTIVE_BALLS
    ){

      balls.push(
        createBall(type)
      );

      count--;
    }
  }

  if(!balls.length){

    data.balls.basic=1;

    balls.push(
      createBall(
        "basic",
        W/2,
        H/2
      )
    );
  }
}

/* =========================================================
   BUILD LEVEL
========================================================= */

function buildLevel(){

  blocks=[];

  const cols=5;
  const gap=5;
  const margin=12;

  const blockWidth=
    (
      W-
      margin*2-
      gap*(cols-1)
    )/cols;

  const blockHeight=45;

  const rows=
    Math.min(
      11,
      4+
      Math.floor(
        (data.level-1)/12
      )
    );

  for(
    let row=0;
    row<rows;
    row++
  ){

    for(
      let col=0;
      col<cols;
      col++
    ){

      /*
        Lower HP than before.
      */

      const hp=
        Math.max(
          1,
          Math.floor(
            3+
            data.level*.9+
            row*1.2
          )
        );

      blocks.push({

        x:
          margin+
          col*(blockWidth+gap),

        y:
          125+
          row*(blockHeight+gap),

        width:blockWidth,
        height:blockHeight,

        hp,
        maxHp:hp,

        dead:false,

        hitFlash:0
      });
    }
  }

  for(
    const ball of balls
  ){
    ball.hitCooldown.clear();
  }
}

/* =========================================================
   BLOCK COLLISION
========================================================= */

function collideBallBlock(
  ball,
  block
){

  if(
    block.dead ||
    ball.mergeLocked
  ){
    return false;
  }

  if(
    (ball.hitCooldown.get(block)||0)>0
  ){
    return false;
  }

  const cx=
    Math.max(
      block.x,
      Math.min(
        ball.x,
        block.x+block.width
      )
    );

  const cy=
    Math.max(
      block.y,
      Math.min(
        ball.y,
        block.y+block.height
      )
    );

  const dx=
    ball.x-cx;

  const dy=
    ball.y-cy;

  if(
    dx*dx+
    dy*dy >
    ball.radius*
    ball.radius
  ){
    return false;
  }

  /* Bounce */

  if(
    Math.abs(dx) >
    Math.abs(dy)
  ){

    ball.vx*=-1;

  }else{

    ball.vy*=-1;
  }

  /* Prevent sticking */

  const len=
    Math.hypot(
      ball.vx,
      ball.vy
    );

  const wanted=
    baseSpeed()*
    speedBoost;

  if(len>0){

    ball.vx=
      ball.vx/len*wanted;

    ball.vy=
      ball.vy/len*wanted;
  }

  /* +3 credits per bounce */

  data.credits+=3;

  ball.hitCooldown.set(
    block,
    .08
  );

  block.hp -=
    ballDamage(
      ball.type
    );

  block.hitFlash=.12;

  createImpact(
    ball.x,
    ball.y,
    ball.color
  );

  if(block.hp<=0){

    block.hp=0;
    block.dead=true;

    data.credits+=
      Math.max(
        1,
        Math.floor(
          block.maxHp*.5
        )
      );

    createBreakEffect(
      block.x+
      block.width/2,
      block.y+
      block.height/2
    );
  }

  updateHUD();

  return true;
}

/* =========================================================
   LEVEL CHECK
========================================================= */

function checkLevelComplete(){

  if(levelChanging){
    return;
  }

  if(
    blocks.length &&
    blocks.every(
      b=>b.dead
    )
  ){

    levelChanging=true;

    setTimeout(()=>{

      if(
        data.level<
        MAX_LEVEL
      ){

        data.level++;

        if(
          data.level%10===0
        ){
          data.runShards++;
        }

        buildLevel();

        save();

        updateHUD();

        showToast(
          "⭐ Level "+
          data.level
        );
      }

      levelChanging=false;

    },120);
  }
}

/* =========================================================
   AUTOMATIC MERGE
========================================================= */

function checkAutoMerge(){

  if(mergeState){
    return;
  }

  const order=[
    ["basic","green"],
    ["green","pink"],
    ["pink","flame"]
  ];

  for(
    const [from,to] of order
  ){

    if(
      data.balls[from]>=10
    ){

      startMerge(
        from,
        to
      );

      return;
    }
  }
}

/* =========================================================
   START MERGE
========================================================= */

function startMerge(
  from,
  to
){

  if(mergeState){
    return;
  }

  const selected=
    balls
      .filter(
        b=>
          b.type===from &&
          b.alive
      )
      .slice(0,10);

  if(
    selected.length<10
  ){
    return;
  }

  data.balls[from]-=10;

  for(
    const ball of selected
  ){

    ball.mergeLocked=true;
  }

  const centerX=W/2;
  const centerY=H/2;

  mergeState={

    from,
    to,

    balls:selected,

    centerX,
    centerY,

    timer:0,

    duration:1.7
  };

  showToast(
    "✨ 10 "+
    from+
    " balls merging..."
  );
}

/* =========================================================
   UPDATE MERGE
========================================================= */

function updateMerge(dt){

  if(!mergeState){
    return;
  }

  const m=
    mergeState;

  m.timer+=dt;

  const progress=
    Math.min(
      1,
      m.timer/
      m.duration
    );

  /*
    Smooth movement toward center.
  */

  const ease=
    1-
    Math.pow(
      1-progress,
      3
    );

  for(
    let i=0;
    i<m.balls.length;
    i++
  ){

    const ball=
      m.balls[i];

    const angle=
      i/
      m.balls.length*
      Math.PI*2;

    const startRadius=
      75;

    const radius=
      startRadius*
      (1-ease);

    const targetX=
      m.centerX+
      Math.cos(angle)*
      radius;

    const targetY=
      m.centerY+
      Math.sin(angle)*
      radius;

    ball.x +=
      (
        targetX-
        ball.x
      )*
      Math.min(
        1,
        dt*8
      );

    ball.y +=
      (
        targetY-
        ball.y
      )*
      Math.min(
        1,
        dt*8
      );

    ball.vx=0;
    ball.vy=0;

    ball.trail=[];
  }

  if(
    progress>=1
  ){

    for(
      const ball of
      m.balls
    ){

      ball.alive=false;
    }

    data.balls[m.to]++;

    createMergeEffect(
      m.centerX,
      m.centerY
    );

    mergeState=null;

    rebuildBalls();

    save();

    updateHUD();

    /*
      Check if another
      automatic merge is ready.
    */

    setTimeout(
      checkAutoMerge,
      80
    );
  }
}

/* =========================================================
   UPDATE BALL
========================================================= */

function updateBall(
  ball,
  dt
){

  if(
    !ball.alive ||
    ball.mergeLocked
  ){
    return;
  }

  for(
    const [block,time]
    of ball.hitCooldown
  ){

    const next=
      time-dt;

    if(next<=0){
      ball.hitCooldown.delete(
        block
      );
    }else{
      ball.hitCooldown.set(
        block,
        next
      );
    }
  }

  ball.trail.push({
    x:ball.x,
    y:ball.y
  });

  if(
    ball.trail.length>8
  ){
    ball.trail.shift();
  }

  ball.x+=
    ball.vx*dt;

  ball.y+=
    ball.vy*dt;

  /* Walls */

  if(
    ball.x-
    ball.radius<=0
  ){

    ball.x=
      ball.radius;

    ball.vx=
      Math.abs(
        ball.vx
      );
  }

  if(
    ball.x+
    ball.radius>=W
  ){

    ball.x=
      W-ball.radius;

    ball.vx=
      -Math.abs(
        ball.vx
      );
  }

  if(
    ball.y-
    ball.radius<=0
  ){

    ball.y=
      ball.radius;

    ball.vy=
      Math.abs(
        ball.vy
      );
  }

  if(
    ball.y+
    ball.radius>=H
  ){

    ball.y=
      H-ball.radius;

    ball.vy=
      -Math.abs(
        ball.vy
      );
  }

  for(
    const block of blocks
  ){

    if(
      collideBallBlock(
        ball,
        block
      )
    ){
      break;
    }
  }
}

/* =========================================================
   PARTICLES
========================================================= */

function createImpact(
  x,
  y,
  color
){

  for(
    let i=0;
    i<5;
    i++
  ){

    const angle=
      Math.random()*
      Math.PI*2;

    const speed=
      35+
      Math.random()*70;

    particles.push({

      x,
      y,

      vx:
        Math.cos(angle)*
        speed,

      vy:
        Math.sin(angle)*
        speed,

      life:
        .25+
        Math.random()*.25,

      size:
        1.5+
        Math.random()*2,

      color
    });
  }
}

function createBreakEffect(
  x,
  y
){

  for(
    let i=0;
    i<12;
    i++
  ){

    const angle=
      Math.random()*
      Math.PI*2;

    const speed=
      40+
      Math.random()*100;

    particles.push({

      x,
      y,

      vx:
        Math.cos(angle)*
        speed,

      vy:
        Math.sin(angle)*
        speed,

      life:
        .4+
        Math.random()*.3,

      size:
        2+
        Math.random()*2,

      color:
        "#ffffff"
    });
  }
}

function createMergeEffect(
  x,
  y
){

  for(
    let i=0;
    i<35;
    i++
  ){

    const angle=
      Math.random()*
      Math.PI*2;

    const speed=
      40+
      Math.random()*150;

    particles.push({

      x,
      y,

      vx:
        Math.cos(angle)*
        speed,

      vy:
        Math.sin(angle)*
        speed,

      life:
        .5+
        Math.random()*.5,

      size:
        2+
        Math.random()*3,

      color:
        i%2?
        "#ffffff":
        "#7dffcf"
    });
  }
}

function updateParticles(dt){

  for(
    let i=
      particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];

    p.x+=
      p.vx*dt;

    p.y+=
      p.vy*dt;

    p.vx*=
      Math.pow(
        .08,
        dt
      );

    p.vy*=
      Math.pow(
        .08,
        dt
      );

    p.life-=dt;

    if(
      p.life<=0
    ){
      particles.splice(
        i,
        1
      );
    }
  }
}

/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

  ctx.fillStyle=
    "#05070d";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  ctx.strokeStyle=
    "rgba(255,255,255,.025)";

  const grid=35;

  for(
    let x=0;
    x<W;
    x+=grid
  ){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(
    let y=0;
    y<H;
    y+=grid
  ){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }
}

/* =========================================================
   DRAW BLOCK
========================================================= */

function drawBlock(
  block
){

  if(block.dead){
    return;
  }

  const hpRatio=
    block.hp/
    block.maxHp;

  ctx.save();

  /*
    Realistic depth
  */

  ctx.fillStyle=
    "rgba(0,0,0,.35)";

  ctx.fillRect(
    block.x+2,
    block.y+3,
    block.width,
    block.height
  );

  const gradient=
    ctx.createLinearGradient(
      block.x,
      block.y,
      block.x,
      block.y+
      block.height
    );

  gradient.addColorStop(
    0,
    "hsl("+
    (205-hpRatio*120)+
    ",75%,58%)"
  );

  gradient.addColorStop(
    1,
    "hsl("+
    (205-hpRatio*120)+
    ",75%,32%)"
  );

  ctx.fillStyle=
    gradient;

  ctx.fillRect(
    block.x,
    block.y,
    block.width,
    block.height
  );

  ctx.strokeStyle=
    "rgba(255,255,255,.25)";

  ctx.strokeRect(
    block.x,
    block.y,
    block.width,
    block.height
  );

  /*
    Damage highlight.
    No HP numbers.
  */

  if(block.hitFlash>0){

    ctx.fillStyle=
      "rgba(255,255,255,"+
      block.hitFlash*4+
      ")";

    ctx.fillRect(
      block.x,
      block.y,
      block.width,
      block.height
    );

    block.hitFlash-=.016;
  }

  ctx.restore();
}

/* =========================================================
   DRAW BALL
========================================================= */

function drawBall(
  ball
){

  if(!ball.alive){
    return;
  }

  /*
    Trail
  */

  for(
    let i=0;
    i<ball.trail.length;
    i++
  ){

    const p=
      ball.trail[i];

    ctx.globalAlpha=
      (i/
      ball.trail.length)*
      .22;

    ctx.fillStyle=
      ball.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      ball.radius*
      (i/
      ball.trail.length),
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;

  /*
    Flame effect around
    the actual ball.
  */

  if(
    ball.type==="flame"
  ){

    for(
      let i=0;
      i<5;
      i++
    ){

      const angle=
        performance.now()/180+
        i*1.25;

      const fx=
        ball.x+
        Math.cos(angle)*
        (ball.radius+3);

      const fy=
        ball.y+
        Math.sin(angle)*
        (ball.radius+3);

      ctx.globalAlpha=.45;

      ctx.fillStyle=
        i%2?
        "#ff5a16":
        "#ffd23c";

      ctx.beginPath();

      ctx.arc(
        fx,
        fy,
        3+
        Math.sin(
          performance.now()/100+i
        )*1.5,
        0,
        Math.PI*2
      );

      ctx.fill();
    }

    ctx.globalAlpha=1;
  }

  /*
    Glow
  */

  ctx.save();

  ctx.shadowColor=
    ball.color;

  ctx.shadowBlur=
    ball.type==="flame"
      ? 24
      : 14;

  ctx.fillStyle=
    ball.color;

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.radius,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  /*
    Realistic highlight
  */

  const highlight=
    ctx.createRadialGradient(
      ball.x-ball.radius*.35,
      ball.y-ball.radius*.4,
      1,
      ball.x,
      ball.y,
      ball.radius
    );

  highlight.addColorStop(
    0,
    "rgba(255,255,255,.95)"
  );

  highlight.addColorStop(
    .25,
    "rgba(255,255,255,.35)"
  );

  highlight.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.fillStyle=
    highlight;

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.radius,
    0,
    Math.PI*2
  );

  ctx.fill();
}

/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles(){

  for(
    const p of particles
  ){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life
      );

    ctx.fillStyle=
      p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

  drawBackground();

  for(
    const block of blocks
  ){
    drawBlock(block);
  }

  for(
    const ball of balls
  ){
    drawBall(ball);
  }

  drawParticles();

  /*
    Merge center glow
  */

  if(mergeState){

    const p=
      Math.min(
        1,
        mergeState.timer/
        mergeState.duration
      );

    const radius=
      15+
      p*55;

    const glow=
      ctx.createRadialGradient(
        mergeState.centerX,
        mergeState.centerY,
        0,
        mergeState.centerX,
        mergeState.centerY,
        radius
      );

    glow.addColorStop(
      0,
      "rgba(255,255,255,.35)"
    );

    glow.addColorStop(
      1,
      "rgba(255,255,255,0)"
    );

    ctx.fillStyle=
      glow;

    ctx.beginPath();

    ctx.arc(
      mergeState.centerX,
      mergeState.centerY,
      radius,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}

/* =========================================================
   BALL PRICE
========================================================= */

function ballPrice(){

  const normal=
    100*
    Math.pow(
      1.05,
      data.ballBuyCount
    );

  const discount=
    Math.pow(
      .90,
      data.lowPriceLevel
    );

  return Math.max(
    10,
    Math.floor(
      normal*discount
    )
  );
}

/* =========================================================
   BUY BALL
========================================================= */

document
  .getElementById("buyBall")
  .addEventListener(
    "pointerup",
    e=>{

      e.preventDefault();

      if(
        totalBallCount()>=
        MAX_ACTIVE_BALLS
      ){

        showToast(
          "Maximum balls!"
        );

        return;
      }

      const cost=
        ballPrice();

      if(
        data.credits<cost
      ){

        showToast(
          "Not enough credits!"
        );

        return;
      }

      data.credits-=cost;

      data.balls.basic++;

      data.ballBuyCount++;

      rebuildBalls();

      save();

      updateHUD();

      showToast(
        "⚪ New ball!"
      );

      checkAutoMerge();
    }
  );

/* =========================================================
   HUD
========================================================= */

function fmt(n){

  if(n<1000){
    return Math.floor(n);
  }

  if(n<1000000){

    return (
      n/1000
    ).toFixed(
      n<10000?1:0
    )+"K";
  }

  return (
    n/1000000
  ).toFixed(1)+"M";
}

function updateHUD(){

  document
    .getElementById("credits")
    .textContent=
      fmt(data.credits);

  document
    .getElementById("level")
    .textContent=
      data.level;

  document
    .getElementById("shards")
    .textContent=
      data.totalShards;

  document
    .getElementById("basicCount")
    .textContent=
      data.balls.basic;

  document
    .getElementById("greenCount")
    .textContent=
      data.balls.green;

  document
    .getElementById("pinkCount")
    .textContent=
      data.balls.pink;

  document
    .getElementById("flameCount")
    .textContent=
      data.balls.flame;

  const bp=
    ballPrice();

  document
    .getElementById(
      "ballPriceInfo"
    )
    .textContent=
      "Current price: "+
      fmt(bp)+
      " credits";

  const buy=
    document
      .getElementById(
        "buyBall"
      );

  buy.textContent=
    "Buy — "+
    fmt(bp)+
    " 💰";

  buy.disabled=
    data.credits<bp ||
    totalBallCount()>=
    MAX_ACTIVE_BALLS;

  const dc=
    damageCost();

  document
    .getElementById(
      "damageInfo"
    )
    .textContent=
      "Level "+
      data.damageLevel+
      " • "+
      fmt(dc)+
      " 💰";

  document
    .getElementById(
      "upgradeDamage"
    )
    .textContent=
      "Upgrade — "+
      fmt(dc);

  document
    .getElementById(
      "upgradeDamage"
    )
    .disabled=
      data.credits<dc;

  const sc=
    250*
    data.speedLevel;

  if(
    data.speedLevel>=8
  ){

    document
      .getElementById(
        "speedInfo"
      )
      .textContent=
        "MAX SPEED";

    document
      .getElementById(
        "upgradeSpeed"
      )
      .textContent=
        "MAX";

    document
      .getElementById(
        "upgradeSpeed"
      )
      .disabled=true;

  }else{

    document
      .getElementById(
        "speedInfo"
      )
      .textContent=
        "Level "+
        data.speedLevel+
        " • "+
        fmt(sc)+
        " 💰";

    document
      .getElementById(
        "upgradeSpeed"
      )
      .textContent=
        "Upgrade — "+
        fmt(sc);

    document
      .getElementById(
        "upgradeSpeed"
      )
      .disabled=
        data.credits<sc;
  }

  const lc=
    lowPriceCost();

  document
    .getElementById(
      "lowPriceInfo"
    )
    .textContent=
      "Level "+
      data.lowPriceLevel+
      " • Cost "+
      fmt(lc);

  document
    .getElementById(
      "lowPriceBtn"
    )
    .textContent=
      "Lower Price — "+
      fmt(lc);

  document
    .getElementById(
      "lowPriceBtn"
    )
    .disabled=
      data.credits<lc;

  const db=
    document
      .getElementById(
        "doubleDamageBtn"
      );

  if(data.doubleDamage){

    db.textContent=
      "ACTIVE ✓";

    db.disabled=true;

  }else{

    db.textContent=
      "Buy — 5,000 💰";

    db.disabled=
      data.credits<5000;
  }

  const rb=
    document
      .getElementById(
        "rebirthBtn"
      );

  if(data.level<100){

    rb.textContent=
      "Level 100 Required";

    rb.disabled=true;

  }else if(
    data.runShards<=0
  ){

    rb.textContent=
      "No Run Shards";

    rb.disabled=true;

  }else{

    rb.textContent=
      "REBIRTH +"+
      data.runShards+
      " 💎";

    rb.disabled=false;
  }

  document
    .getElementById(
      "rebirthInfo"
    )
    .textContent=
      data.level>=100
        ? "Convert run shards into permanent shards."
        : "Reach Level 100.";
}

/* =========================================================
   TOAST
========================================================= */

function showToast(
  message
){

  toastEl.textContent=
    message;

  toastEl.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer=
    setTimeout(
      ()=>{
        toastEl.classList.remove(
          "show"
        );
      },
      1500
    );
}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

  let dt=
    (now-lastTime)/1000;

  lastTime=now;

  dt=
    Math.min(
      .033,
      dt
    );

  if(
    !shop.classList.contains(
      "show"
    )
  ){

    if(!levelChanging){

      updateMerge(dt);

      if(!mergeState){

        for(
          const ball of balls
        ){

          updateBall(
            ball,
            dt
          );
        }

        checkLevelComplete();

        checkAutoMerge();
      }
    }

    updateParticles(dt);
  }

  draw();

  requestAnimationFrame(
    loop
  );
}

/* =========================================================
   START
========================================================= */

resize();

buildLevel();

rebuildBalls();

updateHUD();

requestAnimationFrame(
  loop
);

setInterval(
  save,
  2000
);

</script>
