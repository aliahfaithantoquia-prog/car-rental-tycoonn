<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Orb Breaker</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#070a14;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
  touch-action:none;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  position:relative;
  width:min(100vw,430px);
  height:100vh;
  max-height:900px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,#17265a 0%,#0b1026 42%,#050711 100%);
  box-shadow:0 0 50px rgba(0,0,0,.65);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  height:58px;
  display:flex;
  align-items:center;
  gap:7px;
  z-index:5;
}

.stat{
  flex:1;
  min-width:0;
  height:52px;
  padding:7px 8px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  background:rgba(10,15,35,.82);
  backdrop-filter:blur(8px);
  box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.label{
  font-size:9px;
  opacity:.55;
  text-transform:uppercase;
}

.value{
  margin-top:3px;
  font-size:15px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#shopBtn{
  height:52px;
  border:0;
  border-radius:14px;
  padding:0 13px;
  color:white;
  font-weight:900;
  font-size:13px;
  background:linear-gradient(135deg,#7c3cff,#b14cff);
  box-shadow:0 6px 20px rgba(137,64,255,.35);
}

#shop{
  position:absolute;
  z-index:10;
  left:12px;
  right:12px;
  bottom:12px;
  padding:15px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:20px;
  background:rgba(8,12,29,.96);
  box-shadow:0 15px 50px rgba(0,0,0,.6);
  display:none;
}

#shop.show{display:block}

.shopTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  font-size:18px;
  font-weight:900;
}

.close{
  width:32px;
  height:32px;
  border:0;
  border-radius:10px;
  background:#202640;
  color:white;
  font-size:18px;
}

.shopGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.shopItem{
  padding:12px;
  border-radius:14px;
  background:#111832;
  border:1px solid rgba(255,255,255,.08);
}

.shopItem b{
  display:block;
  font-size:13px;
}

.shopItem small{
  display:block;
  margin:4px 0 9px;
  opacity:.55;
  font-size:10px;
}

.shopItem button{
  width:100%;
  padding:9px;
  border:0;
  border-radius:9px;
  background:#27345e;
  color:white;
  font-weight:800;
}

.shopItem button:active{
  transform:scale(.97);
}

#toast{
  position:absolute;
  z-index:20;
  top:78px;
  left:50%;
  transform:translateX(-50%) translateY(-10px);
  opacity:0;
  pointer-events:none;
  padding:9px 14px;
  border-radius:20px;
  background:rgba(15,20,45,.92);
  border:1px solid rgba(255,255,255,.12);
  font-weight:800;
  font-size:12px;
  transition:.2s;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div id="game">

  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="stat">
      <div class="label">Credits</div>
      <div class="value" id="credits">0</div>
    </div>

    <div class="stat">
      <div class="label">Level</div>
      <div class="value" id="level">1</div>
    </div>

    <div class="stat">
      <div class="label">Shards</div>
      <div class="value" id="shards">0</div>
    </div>

    <button id="shopBtn">🛒 SHOP</button>
  </div>

  <div id="toast"></div>

  <div id="shop">

    <div class="shopTitle">
      <span>🛒 SHOP</span>
      <button class="close" id="closeShop">×</button>
    </div>

    <div class="shopGrid">

      <div class="shopItem">
        <b>⚪ Buy Ball</b>
        <small id="ballInfo">Basic Ball ×1</small>
        <button id="buyBall">BUY 100</button>
      </div>

      <div class="shopItem">
        <b>⚔️ Damage</b>
        <small id="damageInfo">Damage Level 1</small>
        <button id="upgradeDamage">UPGRADE</button>
      </div>

      <div class="shopItem">
        <b>💨 Speed</b>
        <small id="speedInfo">Speed 1.2×</small>
        <button id="upgradeSpeed">UPGRADE</button>
      </div>

      <div class="shopItem">
        <b>💥 Double Damage</b>
        <small>2× current damage</small>
        <button id="doubleDamage">BUY</button>
      </div>

      <div class="shopItem">
        <b>🟢 Ball Merge</b>
        <small id="mergeInfo">10 Basic → 1 Green</small>
        <button id="mergeBall">MERGE</button>
      </div>

      <div class="shopItem">
        <b>✨ Permanent Shards</b>
        <small id="shardInfo">+0% permanent damage</small>
        <button id="rebirth">REBIRTH</button>
      </div>

    </div>
  </div>

</div>

<script>
"use strict";

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const game = document.getElementById("game");

let W = 430;
let H = 800;
let dpr = 1;

function resize(){

  const rect = game.getBoundingClientRect();

  dpr = Math.min(window.devicePixelRatio || 1,2);

  W = rect.width;
  H = rect.height;

  canvas.width = Math.floor(W*dpr);
  canvas.height = Math.floor(H*dpr);

  canvas.style.width = W+"px";
  canvas.style.height = H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  /* Don't rebuild balls or blocks during resize */
  if(blocks.length===0){
    buildLevel();
  }

  for(const b of balls){
    b.x = Math.max(b.r+2,Math.min(W-b.r-2,b.x));
    b.y = Math.max(78+b.r,Math.min(H-b.r-2,b.y));
  }
}

window.addEventListener("resize",resize);


/* =========================
   DATA
========================= */

let data = {
  credits:500,
  level:1,
  totalShards:0,
  runShards:0,

  damageLevel:1,
  speedLevel:1,
  doubleDamage:false,

  balls:{
    basic:1,
    green:0,
    pink:0,
    flame:0
  }
};

try{
  const saved = localStorage.getItem("orbBreakerSave");
  if(saved){
    data = Object.assign(data,JSON.parse(saved));
    data.balls = Object.assign({
      basic:1,
      green:0,
      pink:0,
      flame:0
    },data.balls);
  }
}catch(e){}

function save(){
  try{
    localStorage.setItem("orbBreakerSave",JSON.stringify(data));
  }catch(e){}
}


/* =========================
   BALL TYPES
========================= */

const BALL_TYPES = {

  basic:{
    name:"Basic",
    color:"#eaf7ff",
    glow:"#8ed8ff",
    damage:1,
    radius:7
  },

  green:{
    name:"Green",
    color:"#6dff9b",
    glow:"#24ff71",
    damage:10,
    radius:8
  },

  pink:{
    name:"Pink",
    color:"#ff7bd9",
    glow:"#ff2fbd",
    damage:100,
    radius:9
  },

  flame:{
    name:"Flame",
    color:"#ff9a3c",
    glow:"#ff3b00",
    damage:1000,
    radius:10
  }
};

const TIER_ORDER = ["basic","green","pink","flame"];


/* =========================
   GAME ARRAYS
========================= */

let balls = [];
let blocks = [];
let particles = [];
let floatingTexts = [];

let shake = 0;


/* =========================
   HELPERS
========================= */

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function rand(a,b){
  return Math.random()*(b-a)+a;
}

function format(n){
  if(n>=1e12)return (n/1e12).toFixed(1)+"T";
  if(n>=1e9)return (n/1e9).toFixed(1)+"B";
  if(n>=1e6)return (n/1e6).toFixed(1)+"M";
  if(n>=1e3)return (n/1e3).toFixed(1)+"K";
  return Math.floor(n);
}

function ballDamage(type){

  const base = BALL_TYPES[type].damage;

  let d = base;

  d *= Math.pow(1.25,data.damageLevel-1);

  d *= 1 + data.totalShards/100;

  if(data.doubleDamage){
    d *= 2;
  }

  return d;
}

function upgradeCost(){
  return Math.floor(100*Math.pow(1.08,data.damageLevel-1));
}

function speedMultiplier(){
  return 1 + (data.speedLevel-1)*0.12;
}


/* =========================
   BALL CREATION
========================= */

function createBall(type){

  const info = BALL_TYPES[type];

  let angle;

  /* Avoid nearly-horizontal / nearly-vertical trajectories */
  do{
    angle = rand(0,Math.PI*2);
  }while(
    Math.abs(Math.sin(angle))<0.35 ||
    Math.abs(Math.cos(angle))<0.25
  );

  const speed =
    (145 + data.speedLevel*10) *
    speedMultiplier();

  return {
    type,
    x:W/2 + rand(-25,25),
    y:H*.72 + rand(-10,10),

    vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,

    r:info.radius,

    hitCooldown:new Map(),

    trail:[]
  };
}


/* =========================
   REBUILD BALLS
========================= */

function rebuildBalls(){

  balls=[];

  for(const type of TIER_ORDER){

    const count = data.balls[type] || 0;

    for(let i=0;i<count;i++){

      if(balls.length>=80)break;

      balls.push(createBall(type));
    }
  }

  if(balls.length===0){

    data.balls.basic=1;

    balls.push(createBall("basic"));
  }
}


/* =========================
   BLOCKS
========================= */

function buildLevel(){

  blocks=[];

  const cols = 5;

  const gap = 7;

  const side = 13;

  const top = 115;

  const bw = (W-side*2-gap*(cols-1))/cols;

  const rows =
    Math.min(
      11,
      4 + Math.floor((data.level-1)/12)
    );

  const bh = 45;

  for(let r=0;r<rows;r++){

    for(let c=0;c<cols;c++){

      const hpBase =
        4 +
        data.level*1.8 +
        r*3 +
        Math.floor(data.level/10);

      const hp =
        Math.max(
          1,
          Math.floor(hpBase * rand(.82,1.18))
        );

      blocks.push({

        x:side+c*(bw+gap),

        y:top+r*(bh+gap),

        w:bw,

        h:bh,

        hp,

        maxHp:hp,

        flash:0,

        dead:false
      });
    }
  }
}


/* =========================
   PARTICLES
========================= */

function explode(x,y,strong=false){

  const amount = strong ? 28 : 12;

  for(let i=0;i<amount;i++){

    const a=rand(0,Math.PI*2);
    const s=rand(50,strong?260:170);

    particles.push({

      x,y,

      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s,

      life:1,

      size:rand(2,5),

      strong
    });
  }
}


/* =========================
   FLOATING TEXT
========================= */

function floatText(x,y,text){

  floatingTexts.push({
    x,
    y,
    text,
    life:1
  });
}


/* =========================
   TOAST
========================= */

let toastTimer=0;

function toast(text){

  const el=document.getElementById("toast");

  el.textContent=text;

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },1300);
}


/* =========================
   COLLISION
========================= */

function collideBallBlock(ball,b){

  if(b.dead)return false;

  const cooldown =
    ball.hitCooldown.get(b) || 0;

  if(cooldown>0)return false;

  const closestX =
    clamp(ball.x,b.x,b.x+b.w);

  const closestY =
    clamp(ball.y,b.y,b.y+b.h);

  let dx=ball.x-closestX;
  let dy=ball.y-closestY;

  let distSq=dx*dx+dy*dy;

  if(distSq>ball.r*ball.r)return false;

  let nx,ny,penetration;

  /* Ball center is inside rectangle */
  if(distSq===0){

    const left =
      Math.abs(ball.x-b.x);

    const right =
      Math.abs(ball.x-(b.x+b.w));

    const top =
      Math.abs(ball.y-b.y);

    const bottom =
      Math.abs(ball.y-(b.y+b.h));

    const min=Math.min(left,right,top,bottom);

    if(min===left){
      nx=-1;ny=0;
      penetration=ball.r+left;
    }
    else if(min===right){
      nx=1;ny=0;
      penetration=ball.r+right;
    }
    else if(min===top){
      nx=0;ny=-1;
      penetration=ball.r+top;
    }
    else{
      nx=0;ny=1;
      penetration=ball.r+bottom;
    }

  }else{

    const dist=Math.sqrt(distSq);

    nx=dx/dist;
    ny=dy/dist;

    penetration=ball.r-dist;
  }

  /* Push ball outside the block */
  ball.x += nx*(penetration+0.8);
  ball.y += ny*(penetration+0.8);

  /* Reflect only if travelling into the block */
  const vn =
    ball.vx*nx +
    ball.vy*ny;

  if(vn<0){

    ball.vx -= 2*vn*nx;
    ball.vy -= 2*vn*ny;
  }

  ball.hitCooldown.set(b,0.07);

  /* Damage */
  const damage =
    ballDamage(ball.type);

  b.hp-=damage;

  b.flash=1;

  explode(ball.x,ball.y,false);

  shake=Math.min(8,shake+.45);

  if(b.hp<=0){

    b.dead=true;

    const reward =
      Math.floor(
        5 +
        data.level*2 +
        b.maxHp*.25
      );

    data.credits+=reward;

    floatText(
      b.x+b.w/2,
      b.y+b.h/2,
      "+"+format(reward)
    );

    explode(
      b.x+b.w/2,
      b.y+b.h/2,
      true
    );

    shake=Math.min(14,shake+3);

    checkLevelComplete();
  }

  return true;
}


/* =========================
   LEVEL COMPLETE
========================= */

function checkLevelComplete(){

  if(blocks.every(b=>b.dead)){

    if(data.level<200){

      data.level++;

      if(data.level%10===0){

        data.runShards++;

        toast(
          "✨ +1 Shard"
        );
      }else{

        toast(
          "LEVEL "+data.level+"!"
        );
      }

      buildLevel();

      /* Balls continue moving */
    }
    else{

      toast("🏆 MAX LEVEL 200");
    }

    save();
    updateHUD();
  }
}


/* =========================
   UPDATE BALL
========================= */

function updateBall(ball,dt){

  /* Cooldowns */
  for(const [block,time] of ball.hitCooldown){

    const t=time-dt;

    if(t<=0){
      ball.hitCooldown.delete(block);
    }else{
      ball.hitCooldown.set(block,t);
    }
  }

  /* Trail */
  ball.trail.push({
    x:ball.x,
    y:ball.y
  });

  if(ball.trail.length>8){
    ball.trail.shift();
  }

  /* Move */
  ball.x += ball.vx*dt;
  ball.y += ball.vy*dt;

  /* GAME AREA */
  const top=76+ball.r;
  const left=ball.r;
  const right=W-ball.r;
  const bottom=H-ball.r;

  /* Left */
  if(ball.x<left){

    ball.x=left;

    if(ball.vx<0)
      ball.vx=-ball.vx;
  }

  /* Right */
  if(ball.x>right){

    ball.x=right;

    if(ball.vx>0)
      ball.vx=-ball.vx;
  }

  /* Top */
  if(ball.y<top){

    ball.y=top;

    if(ball.vy<0)
      ball.vy=-ball.vy;
  }

  /* Bottom */
  if(ball.y>bottom){

    ball.y=bottom;

    if(ball.vy>0)
      ball.vy=-ball.vy;
  }

  /* Block collisions */
  for(const block of blocks){

    if(collideBallBlock(ball,block)){

      /* One block collision per frame */
      break;
    }
  }
}


/* =========================
   UPDATE PARTICLES
========================= */

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=250*dt;

    p.life-=dt*1.7;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }

  for(let i=floatingTexts.length-1;i>=0;i--){

    const f=floatingTexts[i];

    f.y-=35*dt;

    f.life-=dt*1.4;

    if(f.life<=0){
      floatingTexts.splice(i,1);
    }
  }

  shake*=Math.pow(.001,dt);

  if(shake<.05)shake=0;
}


/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground(){

  ctx.clearRect(0,0,W,H);

  const g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#101a3b");
  g.addColorStop(.5,"#080d20");
  g.addColorStop(1,"#040610");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /* Grid */
  ctx.globalAlpha=.08;

  ctx.strokeStyle="#8ea4ff";
  ctx.lineWidth=1;

  for(let x=0;x<W;x+=30){

    ctx.beginPath();
    ctx.moveTo(x,75);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(let y=75;y<H;y+=30){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  ctx.globalAlpha=1;

  /* Game border */
  ctx.strokeStyle="rgba(255,255,255,.08)";
  ctx.strokeRect(3,75,W-6,H-78);
}


/* =========================
   DRAW BLOCKS
========================= */

function drawBlock(b){

  if(b.dead)return;

  const ratio =
    clamp(b.hp/b.maxHp,0,1);

  ctx.save();

  /* REQUIRED 0.7 OPACITY */
  ctx.globalAlpha=.7;

  const gradient =
    ctx.createLinearGradient(
      b.x,
      b.y,
      b.x+b.w,
      b.y+b.h
    );

  gradient.addColorStop(
    0,
    `hsl(${215-ratio*120},90%,${30+ratio*20}%)`
  );

  gradient.addColorStop(
    1,
    `hsl(${255-ratio*120},85%,${16+ratio*18}%)`
  );

  ctx.fillStyle=gradient;

  roundRect(
    ctx,
    b.x,
    b.y,
    b.w,
    b.h,
    9
  );

  ctx.fill();

  /* border */
  ctx.strokeStyle="rgba(255,255,255,.22)";
  ctx.lineWidth=1;
  ctx.stroke();

  ctx.globalAlpha=.35;

  /* HP bar */
  ctx.fillStyle="#000";
  ctx.fillRect(
    b.x+6,
    b.y+b.h-9,
    b.w-12,
    4
  );

  ctx.fillStyle="#8fffc2";
  ctx.fillRect(
    b.x+6,
    b.y+b.h-9,
    (b.w-12)*ratio,
    4
  );

  ctx.globalAlpha=.9;

  ctx.fillStyle="white";
  ctx.font="bold 12px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    format(Math.ceil(b.hp)),
    b.x+b.w/2,
    b.y+b.h/2-2
  );

  /* cracks */
  if(ratio<.65){

    ctx.strokeStyle="rgba(255,255,255,.5)";
    ctx.lineWidth=1.2;

    ctx.beginPath();

    ctx.moveTo(
      b.x+b.w*.35,
      b.y+b.h*.2
    );

    ctx.lineTo(
      b.x+b.w*.48,
      b.y+b.h*.48
    );

    ctx.lineTo(
      b.x+b.w*.38,
      b.y+b.h*.75
    );

    ctx.stroke();
  }

  if(ratio<.35){

    ctx.beginPath();

    ctx.moveTo(
      b.x+b.w*.65,
      b.y+b.h*.25
    );

    ctx.lineTo(
      b.x+b.w*.53,
      b.y+b.h*.48
    );

    ctx.lineTo(
      b.x+b.w*.7,
      b.y+b.h*.7
    );

    ctx.stroke();
  }

  if(b.flash>0){

    ctx.globalAlpha=b.flash*.65;

    ctx.fillStyle="#fff";

    roundRect(
      ctx,
      b.x,
      b.y,
      b.w,
      b.h,
      9
    );

    ctx.fill();
  }

  ctx.restore();
}


/* =========================
   DRAW BALL
========================= */

function drawBall(ball){

  const info=BALL_TYPES[ball.type];

  ctx.save();

  /* trail */
  for(let i=0;i<ball.trail.length;i++){

    const t=ball.trail[i];

    const alpha =
      (i/ball.trail.length)*.22;

    ctx.globalAlpha=alpha;

    ctx.fillStyle=info.glow;

    ctx.beginPath();

    ctx.arc(
      t.x,
      t.y,
      ball.r*(i/ball.trail.length),
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  /* glow */
  ctx.globalAlpha=.25;

  ctx.shadowBlur=25;
  ctx.shadowColor=info.glow;

  ctx.fillStyle=info.glow;

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r*2,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* ball */
  ctx.globalAlpha=1;

  ctx.shadowBlur=18;
  ctx.shadowColor=info.glow;

  const g=ctx.createRadialGradient(
    ball.x-ball.r*.35,
    ball.y-ball.r*.35,
    1,
    ball.x,
    ball.y,
    ball.r
  );

  g.addColorStop(0,"#fff");
  g.addColorStop(.3,info.color);
  g.addColorStop(1,info.glow);

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================
   DRAW EFFECTS
========================= */

function drawEffects(){

  for(const p of particles){

    ctx.globalAlpha=clamp(p.life,0,1);

    ctx.fillStyle=
      p.strong
      ? "#ffd86b"
      : "#b8e8ff";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;

  for(const f of floatingTexts){

    ctx.globalAlpha=
      clamp(f.life,0,1);

    ctx.fillStyle="#ffe56b";

    ctx.font="bold 14px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      f.text,
      f.x,
      f.y
    );
  }

  ctx.globalAlpha=1;
}


/* =========================
   ROUND RECT
========================= */

function roundRect(ctx,x,y,w,h,r){

  const rr=Math.min(r,w/2,h/2);

  ctx.beginPath();

  ctx.moveTo(x+rr,y);

  ctx.arcTo(x+w,y,x+w,y+h,rr);

  ctx.arcTo(x+w,y+h,x,y+h,rr);

  ctx.arcTo(x,y+h,x,y,rr);

  ctx.arcTo(x,y,x+w,y,rr);

  ctx.closePath();
}


/* =========================
   MAIN DRAW LOOP
========================= */

let lastTime=performance.now();

function loop(now){

  let dt=(now-lastTime)/1000;

  lastTime=now;

  /* prevent giant jumps after tab switch */
  dt=Math.min(dt,.033);

  updateParticles(dt);

  for(const b of blocks){

    b.flash=Math.max(
      0,
      b.flash-dt*5
    );
  }

  for(const ball of balls){
    updateBall(ball,dt);
  }

  ctx.save();

  if(shake>0){

    ctx.translate(
      rand(-shake,shake),
      rand(-shake,shake)
    );
  }

  drawBackground();

  for(const b of blocks){
    drawBlock(b);
  }

  for(const ball of balls){
    drawBall(ball);
  }

  drawEffects();

  ctx.restore();

  requestAnimationFrame(loop);
}


/* =========================
   HUD
========================= */

function updateHUD(){

  document.getElementById("credits").textContent=
    format(data.credits);

  document.getElementById("level").textContent=
    data.level;

  document.getElementById("shards").textContent=
    data.totalShards + data.runShards;

  document.getElementById("ballInfo").textContent=
    `⚪ ${data.balls.basic}  🟢 ${data.balls.green}  🩷 ${data.balls.pink}  🔥 ${data.balls.flame}`;

  document.getElementById("damageInfo").textContent=
    `Damage Level ${data.damageLevel}`;

  document.getElementById("upgradeDamage").textContent=
    "UPGRADE "+format(upgradeCost());

  document.getElementById("speedInfo").textContent=
    `Speed ${speedMultiplier().toFixed(2)}×`;

  document.getElementById("upgradeSpeed").textContent=
    "UPGRADE "+format(250*data.speedLevel);

  document.getElementById("shardInfo").textContent=
    `+${data.totalShards}% permanent damage`;

  document.getElementById("rebirth").textContent=
    data.level>=100
    ? "REBIRTH"
    : "LV 100 REQUIRED";

  const nextTier=
    data.balls.basic>=10
    ? "10 Basic → 1 Green"
    : data.balls.green>=10
    ? "10 Green → 1 Pink"
    : data.balls.pink>=10
    ? "10 Pink → 1 Flame"
    : "Need 10 same tier";

  document.getElementById("mergeInfo").textContent=
    nextTier;
}


/* =========================
   SHOP
========================= */

const shop=
  document.getElementById("shop");

document.getElementById("shopBtn")
.addEventListener("click",()=>{

  shop.classList.add("show");

  updateHUD();
});

document.getElementById("closeShop")
.addEventListener("click",()=>{

  shop.classList.remove("show");
});


/* BUY BALL */

document.getElementById("buyBall")
.addEventListener("click",()=>{

  const cost=100;

  if(data.credits<cost){

    toast("Not enough Credits");
    return;
  }

  data.credits-=cost;

  data.balls.basic++;

  rebuildBalls();

  save();
  updateHUD();

  toast("⚪ +1 Basic Ball");
});


/* DAMAGE */

document.getElementById("upgradeDamage")
.addEventListener("click",()=>{

  const cost=upgradeCost();

  if(data.credits<cost){

    toast("Not enough Credits");
    return;
  }

  data.credits-=cost;

  data.damageLevel++;

  if(
    data.damageLevel===25 ||
    data.damageLevel===50 ||
    data.damageLevel===75 ||
    data.damageLevel===100
  ){

    toast("🔥 DAMAGE MILESTONE!");
  }else{

    toast("⚔️ Damage Up!");
  }

  save();
  updateHUD();
});


/* SPEED */

document.getElementById("upgradeSpeed")
.addEventListener("click",()=>{

  const cost=250*data.speedLevel;

  if(data.credits<cost){

    toast("Not enough Credits");
    return;
  }

  if(data.speedLevel>=8){

    toast("⚡ MAX SPEED");
    return;
  }

  data.credits-=cost;

  data.speedLevel++;

  rebuildBalls();

  save();
  updateHUD();

  toast("💨 Speed Up!");
});


/* DOUBLE DAMAGE */

document.getElementById("doubleDamage")
.addEventListener("click",()=>{

  if(data.doubleDamage){

    toast("Already Active");
    return;
  }

  const cost=5000;

  if(data.credits<cost){

    toast("Need 5K Credits");
    return;
  }

  data.credits-=cost;

  data.doubleDamage=true;

  save();
  updateHUD();

  toast("💥 DOUBLE DAMAGE!");
});


/* =========================
   MERGE
========================= */

document.getElementById("mergeBall")
.addEventListener("click",()=>{

  let merged=false;

  if(data.balls.basic>=10){

    data.balls.basic-=10;
    data.balls.green++;
    toast("🟢 10 Basic → 1 Green");
    merged=true;

  }else if(data.balls.green>=10){

    data.balls.green-=10;
    data.balls.pink++;
    toast("🩷 10 Green → 1 Pink");
    merged=true;

  }else if(data.balls.pink>=10){

    data.balls.pink-=10;
    data.balls.flame++;
    toast("🔥 10 Pink → 1 Flame");
    merged=true;
  }

  if(!merged){

    toast("Need 10 same-tier Balls");
    return;
  }

  rebuildBalls();

  save();
  updateHUD();
});


/* =========================
   REBIRTH
========================= */

document.getElementById("rebirth")
.addEventListener("click",()=>{

  if(data.level<100){

    toast("Reach Level 100 first");
    return;
  }

  const gained=
    data.runShards;

  if(gained<=0){

    toast("Need run Shards");
    return;
  }

  data.totalShards+=gained;

  data.runShards=0;

  data.credits=500;

  data.level=1;

  data.damageLevel=1;

  data.speedLevel=1;

  data.doubleDamage=false;

  data.balls={
    basic:1,
    green:0,
    pink:0,
    flame:0
  };

  buildLevel();

  rebuildBalls();

  save();

  updateHUD();

  toast(
    "✨ REBIRTH! +"+gained+" Permanent Shards"
  );
});


/* =========================
   START
========================= */

resize();

buildLevel();

rebuildBalls();

updateHUD();

/* IMPORTANT:
   This starts the animation immediately.
*/
requestAnimationFrame(loop);

</script>

</body>
</html>
