<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Orb Breaker</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#070b14;
 font-family:Arial,sans-serif;
 color:white;
}

canvas{
 display:block;
 width:100vw;
 height:100vh;
}

#hud{
 position:fixed;
 top:8px;
 left:8px;
 right:8px;
 z-index:5;
 display:flex;
 gap:6px;
 align-items:center;
 justify-content:space-between;
 pointer-events:none;
}

.badge{
 background:#111a2bf0;
 border:1px solid #34476b;
 border-radius:10px;
 padding:7px 9px;
 font-weight:bold;
 font-size:13px;
}

button{
 border:0;
 border-radius:11px;
 padding:9px 12px;
 background:#294574;
 color:white;
 font-weight:bold;
}

#shop{
 display:none;
 position:fixed;
 top:55px;
 right:10px;
 width:240px;
 z-index:10;
 background:#0d1628f5;
 border:1px solid #3d537c;
 border-radius:15px;
 padding:13px;
}

#shop button{
 width:100%;
 margin-top:7px;
}

.small{
 font-size:12px;
 opacity:.8;
 margin-top:5px;
}
</style>
</head>

<body>

<div id="hud">
 <div class="badge">💰 <span id="credits">0</span></div>
 <div class="badge">LV <span id="level">1</span></div>
 <div class="badge">🔷 <span id="shards">0</span></div>
 <div class="badge">⚪ <span id="ballCount">1</span></div>
 <button id="shopBtn">🛒 SHOP</button>
</div>

<div id="shop">
 <b>ORB SHOP</b>

 <div class="small">
  10 same-tier balls automatically merge.
 </div>

 <button id="buyBtn">
  Buy Basic Ball — 100
 </button>

 <button id="damageBtn">
  Damage Upgrade
 </button>

 <button id="speedBtn">
  Speed
 </button>

 <button id="doubleBtn">
  Double Damage — 10,000
 </button>

 <div id="info" class="small"></div>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

function resize(){

 W=innerWidth;
 H=innerHeight;

 canvas.width=W*DPR;
 canvas.height=H*DPR;

 ctx.setTransform(DPR,0,0,DPR,0,0);

 buildLevel();
}

addEventListener("resize",resize);


/* =========================
   BALL TYPES
========================= */

const TYPES=[
 {
  name:"basic",
  color:"#eaf2ff",
  baseDamage:10
 },
 {
  name:"green",
  color:"#55f28b",
  baseDamage:25
 },
 {
  name:"pink",
  color:"#ff72bd",
  baseDamage:60
 },
 {
  name:"flame",
  color:"#ff9d35",
  baseDamage:150
 }
];


/* =========================
   SAVE DATA
========================= */

let data={
 credits:0,
 level:1,
 shards:0,

 inventory:{
  basic:1,
  green:0,
  pink:0,
  flame:0
 },

 damageLevel:{
  basic:1,
  green:1,
  pink:1,
  flame:1
 },

 speed:1.2,
 doubleDamage:false
};

try{

 const saved=
 JSON.parse(localStorage.getItem("orbBreakerSave")||"null");

 if(saved){
  data={...data,...saved};

  data.inventory={
   ...data.inventory,
   ...(saved.inventory||{})
  };

  data.damageLevel={
   ...data.damageLevel,
   ...(saved.damageLevel||{})
  };
 }

}catch(e){}


function save(){

 localStorage.setItem(
  "orbBreakerSave",
  JSON.stringify(data)
 );

 updateHUD();
}


/* =========================
   GAME VARIABLES
========================= */

let balls=[];
let blocks=[];
let particles=[];
let texts=[];

let lastTime=performance.now();

let levelBanner=0;
let screenShake=0;
let maxLevel=false;


/* =========================
   HUD
========================= */

function updateHUD(){

 document.getElementById("credits").textContent=
  Math.floor(data.credits);

 document.getElementById("level").textContent=
  data.level;

 document.getElementById("shards").textContent=
  data.shards;

 document.getElementById("ballCount").textContent=
  balls.length;

 document.getElementById("info").textContent=
 `Basic ${data.inventory.basic} • `+
 `Green ${data.inventory.green} • `+
 `Pink ${data.inventory.pink} • `+
 `Flame ${data.inventory.flame} • `+${data.shards}% permanent damage`;
}


/* =========================
   DAMAGE
========================= */

function getDamage(type){

 const info=TYPES.find(x=>x.name===type);

 const lv=data.damageLevel[type]||1;

 let damage=
 info.baseDamage*
 Math.pow(1.25,lv-1);

 damage*=1+data.shards/100;

 if(data.doubleDamage)
  damage*=2;

 return damage;
}


/* =========================
   BALL CREATION
========================= */

function createBall(type){

 balls.push({

  type,

  x:W/2,
  y:H*.72,

  r:6,

  vx:(Math.random()<.5?-1:1)*
     (120+Math.random()*60),

  vy:-(150+Math.random()*70),

  trail:[],

  lastHits:new Map()
 });
}


/* =========================
   SYNC BALLS
========================= */

function syncBalls(){

 balls=[];

 for(const type of TYPES){

  const count=data.inventory[type.name]||0;

  for(let i=0;i<count;i++)
   createBall(type);
 }

 if(balls.length===0){

  data.inventory.basic=1;

  createBall("basic");
 }

 updateHUD();
}


/* =========================
   MERGE
========================= */

function mergeBalls(type){

 const index=
  TYPES.findIndex(x=>x.name===type);

 if(index<0 || index>=TYPES.length-1)
  return;

 const next=
  TYPES[index+1].name;

 while(data.inventory[type]>=10){

  data.inventory[type]-=10;

  data.inventory[next]++;

 }
}


/* =========================
   BUILD LEVEL
========================= */

function buildLevel(){

 blocks=[];

 const rows=
  Math.min(
   4+Math.floor(data.level/25),
   8
  );

 const cols=
  Math.min(
   7+Math.floor(data.level/30),
   11
  );

 const gap=5;
 const left=12;
 const top=92;

 const bw=
  (W-left*2-gap*(cols-1))/cols;

 const bh=
  Math.max(
   28,
   Math.min(
    42,
    (H*.48-top)/rows-gap
   )
  );

 const baseHP=
  35+data.level*14;

 for(let r=0;r<rows;r++){

  for(let c=0;c<cols;c++){

   const hp=
    baseHP*
    (1+r*.35+data.level/100);

   blocks.push({

    x:left+c*(bw+gap),

    y:top+r*(bh+gap),

    w:bw,
    h:bh,

    hp,
    maxHP:hp,

    reward:
     5+Math.floor(data.level/2),

    dead:false,

    flash:0
   });
  }
 }

 if(balls.length===0)
  syncBalls();

 updateHUD();

 save();
}


/* =========================
   PARTICLES
========================= */

function burst(x,y,big=false){

 const amount=big?24:7;

 for(let i=0;i<amount;i++){

  const angle=
   Math.random()*Math.PI*2;

  const speed=
   (big?80:45)+
   Math.random()*100;

  particles.push({

   x,
   y,

   vx:Math.cos(angle)*speed,
   vy:Math.sin(angle)*speed,

   life:.45+
        Math.random()*.45,

   size:
    2+Math.random()*4
  });
 }
}


/* =========================
   CLAMP
========================= */

function clamp(value,min,max){

 return Math.max(
  min,
  Math.min(max,value)
 );
}


/* =========================
   BLOCK COLLISION
========================= */

function collideBlock(block,ball,now){

 const closestX=
  clamp(
   ball.x,
   block.x,
   block.x+block.w
  );

 const closestY=
  clamp(
   ball.y,
   block.y,
   block.y+block.h
  );

 let dx=
  ball.x-closestX;

 let dy=
  ball.y-closestY;

 const distanceSquared=
  dx*dx+dy*dy;

 if(
  distanceSquared>
  ball.r*ball.r
 )
  return false;


 const blockID=
  blocks.indexOf(block);

 const previousHit=
  ball.lastHits.get(blockID)||0;

 if(now-previousHit<70)
  return false;

 ball.lastHits.set(
  blockID,
  now
 );


 let nx=0;
 let ny=0;
 let penetration=0;


 /*
   BALL CENTER INSIDE BLOCK
 */

 if(distanceSquared<0.0001){

  const left=
   Math.abs(ball.x-block.x);

  const right=
   Math.abs(
    ball.x-(block.x+block.w)
   );

  const top=
   Math.abs(ball.y-block.y);

  const bottom=
   Math.abs(
    ball.y-(block.y+block.h)
   );

  const nearest=
   Math.min(
    left,
    right,
    top,
    bottom
   );

  if(nearest===left){

   nx=-1;
   ny=0;
   penetration=ball.r+left;

  }else if(nearest===right){

   nx=1;
   ny=0;
   penetration=ball.r+right;

  }else if(nearest===top){

   nx=0;
   ny=-1;
   penetration=ball.r+top;

  }else{

   nx=0;
   ny=1;
   penetration=ball.r+bottom;
  }

 }else{

  const distance=
   Math.sqrt(distanceSquared);

  nx=dx/distance;
  ny=dy/distance;

  penetration=
   ball.r-distance;
 }


 /*
   PUSH BALL OUT OF BLOCK
 */

 ball.x+=
  nx*(penetration+.5);

 ball.y+=
  ny*(penetration+.5);


 /*
   REFLECT VELOCITY
 */

 const velocityNormal=
  ball.vx*nx+
  ball.vy*ny;

 if(velocityNormal<0){

  ball.vx-=
   2*velocityNormal*nx;

  ball.vy-=
   2*velocityNormal*ny;
 }


 /*
   DAMAGE BLOCK
 */

 block.hp-=
  getDamage(ball.type);

 block.flash=1;

 burst(
  ball.x,
  ball.y
 );

 screenShake=
  Math.min(
   8,
   screenShake+1
  );


 /*
   BLOCK DESTROYED
 */

 if(
  block.hp<=0 &&
  !block.dead
 ){

  block.dead=true;

  data.credits+=
   block.reward;

  texts.push({

   text:"+"+block.reward,

   x:block.x+
     block.w/2,

   y:block.y+
     block.h/2,

   life:1
  });

  burst(
   block.x+
   block.w/2,

   block.y+
   block.h/2,

   true
  );


  /*
    NEXT LEVEL
  */

  if(
   blocks.every(b=>b.dead)
  ){

   if(data.level<200){

    data.level++;

    if(
     data.level%10===0
    ){

     data.shards++;
    }

    buildLevel();

    levelBanner=1.3;

   }else{

    data.level=200;

    maxLevel=true;
   }

   save();
  }
 }

 return true;
}


/* =========================
   GAME UPDATE
========================= */

function update(dt,now){

 for(const ball of balls){

  /*
    TRAIL
  */

  ball.trail.unshift({

   x:ball.x,
   y:ball.y
  });

  if(
   ball.trail.length>7
  )
   ball.trail.pop();


  /*
    MOVE
  */

  ball.x+=
   ball.vx*dt;

  ball.y+=
   ball.vy*dt;


  /*
    LEFT BORDER
  */

  if(
   ball.x<ball.r
  ){

   ball.x=ball.r;

   ball.vx=
    Math.abs(ball.vx);
  }


  /*
    RIGHT BORDER
  */

  if(
   ball.x>
   W-ball.r
  ){

   ball.x=
    W-ball.r;

   ball.vx=
    -Math.abs(ball.vx);
  }


  /*
    TOP BORDER
  */

  const topBorder=
   65+ball.r;

  if(
   ball.y<topBorder
  ){

   ball.y=topBorder;

   ball.vy=
    Math.abs(ball.vy);
  }


  /*
    BOTTOM BORDER
    IMPORTANT:
    THE BALL DOES NOT FALL OFF.
  */

  const bottomBorder=
   H-ball.r;

  if(
   ball.y>bottomBorder
  ){

   ball.y=
    bottomBorder;

   ball.vy=
    -Math.abs(ball.vy);
  }


  /*
    BLOCKS
  */

  for(
   const block of blocks
  ){

   if(block.dead)
    continue;

   if(
    collideBlock(
     block,
     ball,
     now
    )
   ){

    break;
   }
  }
 }


 /*
   PARTICLES
 */

 for(
  let i=particles.length-1;
  i>=0;
  i--
 ){

  const p=particles[i];

  p.x+=p.vx*dt;
  p.y+=p.vy*dt;

  p.vy+=300*dt;

  p.life-=dt;

  if(p.life<=0)
   particles.splice(i,1);
 }


 /*
   TEXT
 */

 for(
  let i=texts.length-1;
  i>=0;
  i--
 ){

  const t=texts[i];

  t.y-=35*dt;

  t.life-=dt;

  if(t.life<=0)
   texts.splice(i,1);
 }


 /*
   EFFECTS
 */

 for(
  const block of blocks
 ){

  if(block.flash>0)
   block.flash-=dt*5;
 }

 levelBanner=
  Math.max(
   0,
   levelBanner-dt
  );

 screenShake=
  Math.max(
   0,
   screenShake-dt*12
  );
}


/* =========================
   DRAW
========================= */

function draw(){

 ctx.clearRect(
  0,
  0,
  W,
  H
 );


 /*
   BACKGROUND
 */

 const bg=
  ctx.createRadialGradient(
   W/2,
   H*.2,
   20,
   W/2,
   H*.5,
   H
  );

 bg.addColorStop(
  0,
  "#182642"
 );

 bg.addColorStop(
  1,
  "#070b14"
 );

 ctx.fillStyle=bg;

 ctx.fillRect(
  0,
  0,
  W,
  H
 );


 ctx.save();


 /*
   SCREEN SHAKE
 */

 if(screenShake){

  ctx.translate(
   (Math.random()-.5)*
   screenShake,

   (Math.random()-.5)*
   screenShake
  );
 }


 /*
   BLOCKS
 */

 for(
  const block of blocks
 ){

  if(block.dead)
   continue;


  const ratio=
   Math.max(
    0,
    block.hp/
    block.maxHP
   );


  /*
    0.7 OPACITY
  */

  ctx.globalAlpha=.7;

  const gradient=
   ctx.createLinearGradient(
    block.x,
    block.y,
    block.x,
    block.y+block.h
   );

  gradient.addColorStop(
   0,
   "#708cc0"
  );

  gradient.addColorStop(
   1,
   "#263a63"
  );

  ctx.fillStyle=
   gradient;

  ctx.fillRect(
   block.x,
   block.y,
   block.w,
   block.h
  );


  ctx.globalAlpha=1;

  ctx.strokeStyle=
   block.flash>0?
   "#ffffff":
   "#8195bd";

  ctx.strokeRect(
   block.x,
   block.y,
   block.w,
   block.h
  );


  /*
    HP
  */

  ctx.fillStyle=
   "#ffffff";

  ctx.font=
   "bold 12px Arial";

  ctx.textAlign=
   "center";

  ctx.fillText(
   Math.ceil(block.hp),

   block.x+
   block.w/2,

   block.y+
   block.h/2+
   4
  );


  /*
    HP BAR
  */

  ctx.fillStyle=
   "#10182a";

  ctx.fillRect(
   block.x+3,
   block.y+
   block.h-5,

   (block.w-6)*
   ratio,

   2
  );
 }


 /*
   BALLS
 */

 for(
  const ball of balls
 ){

  const type=
   TYPES.find(
    t=>t.name===ball.type
   );


  /*
    TRAIL
  */

  for(
   let i=ball.trail.length-1;
   i>=0;
   i--
  ){

   const p=
    ball.trail[i];

   ctx.globalAlpha=
    (1-
     i/ball.trail.length)
    *.25;

   ctx.fillStyle=
    type.color;

   ctx.beginPath();

   ctx.arc(
    p.x,
    p.y,
    ball.r,
    0,
    Math.PI*2
   );

   ctx.fill();
  }


  ctx.globalAlpha=1;

  /*
    BALL GLOW
  */

  ctx.shadowBlur=15;
  ctx.shadowColor=
   type.color;

  ctx.fillStyle=
   type.color;

  ctx.beginPath();

  ctx.arc(
   ball.x,
   ball.y,
   ball.r,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;
 }


 /*
   PARTICLES
 */

 for(
  const p of particles
 ){

  ctx.globalAlpha=
   Math.max(
    0,
    p.life
   );

  ctx.fillStyle=
   "#ffffff";

  ctx.fillRect(
   p.x,
   p.y,
   p.size,
   p.size
  );
 }


 /*
   CREDIT TEXT
 */

 for(
  const t of texts
 ){

  ctx.globalAlpha=
   t.life;

  ctx.fillStyle=
   "#ffd86b";

  ctx.font=
   "bold 16px Arial";

  ctx.textAlign=
   "center";

  ctx.fillText(
   t.text,
   t.x,
   t.y
  );
 }


 ctx.restore();

 ctx.globalAlpha=1;


 /*
   LEVEL MESSAGE
 */

 if(levelBanner>0){

  ctx.font=
   "900 34px Arial";

  ctx.textAlign=
   "center";

  ctx.fillStyle=
   "#ffffff";

  ctx.fillText(
   "LEVEL "+data.level,
   W/2,
   H*.78
  );
 }


 if(maxLevel){

  ctx.font=
   "900 28px Arial";

  ctx.textAlign=
   "center";

  ctx.fillStyle=
   "#ffd86b";

  ctx.fillText(
   "MAX LEVEL 200",
   W/2,
   H*.78
  );
 }
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(now){

 const dt=
  Math.min(
   .033,
   (now-lastTime)/1000
  );

 lastTime=now;

 update(
  dt,
  now
 );

 draw();

 updateHUD();

 requestAnimationFrame(
  gameLoop
 );
}


/* =========================
   SHOP
========================= */

document.getElementById(
 "shopBtn"
).onclick=()=>{

 const shop=
  document.getElementById("shop");

 shop.style.display=
  shop.style.display==="block"?
  "none":
  "block";
};


/*
  BUY BALL
*/

document.getElementById(
 "buyBtn"
).onclick=()=>{

 if(
  data.credits>=100
 ){

  data.credits-=100;

  data.inventory.basic++;

  mergeBalls("basic");

  syncBalls();

  save();
 }
};


/*
  DAMAGE
*/

document.getElementById(
 "damageBtn"
).onclick=()=>{

 const lv=
  data.damageLevel.basic;

 const cost=
  Math.floor(
   100*
   Math.pow(
    1.08,
    lv-1
   )
  );

 if(
  lv<100 &&
  data.credits>=cost
 ){

  data.credits-=cost;

  data.damageLevel.basic=
   lv+1;

  save();
 }
};


/*
  SPEED
*/

document.getElementById(
 "speedBtn"
).onclick=()=>{

 if(data.speed<2){

  data.speed=
   Math.min(
    2,
    data.speed+.1
   );

  for(
   const ball of balls
  ){

   ball.vx*=1.05;
   ball.vy*=1.05;
  }

  save();
 }
};


/*
  DOUBLE DAMAGE
*/

document.getElementById(
 "doubleBtn"
).onclick=()=>{

 if(
  !data.doubleDamage &&
  data.credits>=10000
 ){

  data.credits-=10000;

  data.doubleDamage=true;

  save();
 }
};


/* =========================
   START
========================= */

syncBalls();

resize();

requestAnimationFrame(
 gameLoop
);

</script>

</body>
</html>
